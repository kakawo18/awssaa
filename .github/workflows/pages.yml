# main へのプッシュで要点集・問題集を組み立て、GitHub Pages に公開する。
# 初回のみ、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check exam sets
        run: python3 tools/check_exams.py
      - name: Run tests
        run: |
          python3 tools/test_check_exams.py
          python3 tools/test_build_content.py
          python3 tools/test_build_site.py
      - name: Build data and site
        run: |
          python3 tools/build_content.py
          python3 tools/build_exams.py
          python3 tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
