<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" role="img" aria-label="CloudFrontとGlobal Acceleratorの比較。CloudFrontはHTTPとHTTPSの内容をエッジでキャッシュし、ヒットすればオリジンへ行かずに返す。Global Acceleratorはキャッシュを持たず、2つの固定のAnycast IPで受けた通信をAWSのバックボーンで正常なリージョンのエンドポイントへ送り、障害時はDNSに頼らず数十秒で切り替える。TCPとUDPに対応する。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor" color="#1B212E">
  <rect width="100%" height="100%" rx="10" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-cg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
  </defs>

  <!-- CloudFront lane -->
  <text x="10" y="20" font-size="11.5">CloudFront</text>
  <text x="96" y="20" font-size="9.5" fill-opacity="0.7">HTTP／HTTPS・内容をキャッシュ</text>
  <rect x="10" y="34" width="56" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="38" y="55" text-anchor="middle" font-size="10">利用者</text>
  <rect x="104" y="30" width="90" height="42" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="149" y="48" text-anchor="middle" font-size="10">エッジ</text>
  <text x="149" y="62" text-anchor="middle" font-size="9" fill-opacity="0.8">キャッシュ</text>
  <rect x="280" y="34" width="90" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="325" y="50" text-anchor="middle" font-size="10">オリジン</text>
  <text x="325" y="62" text-anchor="middle" font-size="8.5" fill-opacity="0.7">S3・ALBなど</text>
  <line x1="66" y1="45" x2="100" y2="45" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-cg)"/>
  <line x1="100" y1="58" x2="70" y2="58" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-cg)"/>
  <text x="104" y="90" font-size="9.5">✓ ヒット：その場で返す</text>
  <line x1="194" y1="51" x2="276" y2="51" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arw-cg)"/>
  <text x="202" y="44" font-size="9" fill-opacity="0.8">ミスなら取得</text>

  <line x1="10" y1="104" x2="370" y2="104" stroke="currentColor" stroke-opacity="0.2"/>

  <!-- Global Accelerator lane -->
  <text x="10" y="126" font-size="11.5">Global Accelerator</text>
  <text x="146" y="126" font-size="9.5" fill-opacity="0.7">TCP／UDP・キャッシュなし</text>
  <rect x="10" y="150" width="56" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="38" y="171" text-anchor="middle" font-size="10">利用者</text>
  <rect x="96" y="144" width="88" height="46" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="140" y="162" text-anchor="middle" font-size="10">固定IP×2</text>
  <text x="140" y="177" text-anchor="middle" font-size="9" fill-opacity="0.8">（Anycast）</text>
  <line x1="66" y1="167" x2="92" y2="167" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-cg)"/>

  <!-- backbone to regions -->
  <rect x="268" y="136" width="102" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="319" y="152" text-anchor="middle" font-size="10">リージョンA</text>
  <text x="319" y="164" text-anchor="middle" font-size="8.5" fill-opacity="0.7">ALB・NLB・EC2</text>
  <rect x="268" y="196" width="102" height="34" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="4 3"/>
  <text x="319" y="212" text-anchor="middle" font-size="10">リージョンB</text>
  <text x="319" y="224" text-anchor="middle" font-size="8.5" fill-opacity="0.7">待機・正常なら使う</text>
  <line x1="184" y1="160" x2="264" y2="153" stroke="#3F78D8" stroke-width="2.2" marker-end="url(#arw-cg)"/>
  <line x1="184" y1="176" x2="264" y2="208" stroke="#3F78D8" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arw-cg)"/>
  <text x="192" y="146" font-size="9">バックボーン</text>
  <text x="196" y="214" font-size="9">障害時は</text>
  <text x="196" y="226" font-size="9">数十秒で切替</text>

  <!-- notes -->
  <line x1="10" y1="246" x2="370" y2="246" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="264" font-size="10.5">同じ画像・HTMLを何度も配る → CloudFront</text>
  <text x="10" y="283" font-size="10.5">固定IP・TCP／UDP・DNSに頼らない切り替え</text>
  <text x="26" y="299" font-size="10.5">→ Global Accelerator</text>
  <text x="10" y="320" font-size="9.5" fill-opacity="0.75">利用者のIPは変わらないので、DNSのキャッシュの影響を受けない</text>
</svg>