<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 388" role="img" aria-label="多層防御で、通信の経路のどこで何が止めるか。エッジではShieldがDDoSを、WAFがSQLインジェクションやXSSを止める。VPCの入口ではNetwork Firewallがドメインやパケットの中身で止める。サブネットではネットワークACLが拒否ルールで、インスタンスではセキュリティグループが許可ルールで絞る。OSとアプリではInspectorとパッチで脆弱性を減らし、データはKMSの暗号化とブロックパブリックアクセスで守る。全層をCloudTrail、Config、GuardDuty、Security Hubが横から監視する。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor" color="#1B212E">
  <rect width="100%" height="100%" rx="10" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-dl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
    <marker id="arw-dl-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity="0.65"/>
    </marker>
  </defs>
  <rect x="10" y="8" width="250" height="26" rx="13" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="135" y="25" font-size="10" text-anchor="middle">インターネット</text>
  <line x1="135" y1="34" x2="135" y2="47" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-dl-g)"/>
  <rect x="10" y="50" width="250" height="36" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="18" y="65" font-size="10">エッジ</text>
  <text x="18" y="79" font-size="8.5" fill-opacity="0.85">Shield：DDoS ／ WAF：SQLi・XSS・レート</text>
  <line x1="135" y1="84" x2="135" y2="97" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-dl-g)"/>
  <rect x="10" y="100" width="250" height="36" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="18" y="115" font-size="10">VPCの入口</text>
  <text x="18" y="129" font-size="8.5" fill-opacity="0.85">Network Firewall：ドメイン・中身の検査</text>
  <line x1="135" y1="134" x2="135" y2="147" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-dl-g)"/>
  <rect x="10" y="150" width="250" height="36" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="18" y="165" font-size="10">サブネット</text>
  <text x="18" y="179" font-size="8.5" fill-opacity="0.85">ネットワークACL：拒否ルール可・戻りも評価</text>
  <line x1="135" y1="184" x2="135" y2="197" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-dl-g)"/>
  <rect x="10" y="200" width="250" height="36" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="18" y="215" font-size="10">インスタンス</text>
  <text x="18" y="229" font-size="8.5" fill-opacity="0.85">セキュリティグループ：許可だけ</text>
  <line x1="135" y1="234" x2="135" y2="247" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-dl-g)"/>
  <rect x="10" y="250" width="250" height="36" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="18" y="265" font-size="10">OS・アプリ</text>
  <text x="18" y="279" font-size="8.5" fill-opacity="0.85">Inspector：脆弱性 ／ パッチ・Session Manager</text>
  <line x1="135" y1="284" x2="135" y2="297" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-dl-g)"/>
  <rect x="10" y="300" width="250" height="36" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="18" y="315" font-size="10">データ</text>
  <text x="18" y="329" font-size="8.5" fill-opacity="0.85">KMS：暗号化 ／ ブロックパブリックアクセス</text>
  <rect x="272" y="50" width="98" height="222" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="321" y="70" font-size="10" text-anchor="middle">検知・記録</text>
  <text x="321" y="84" font-size="8" text-anchor="middle" fill-opacity="0.75">（全層を横から）</text>
  <text x="321" y="112" font-size="9.5" text-anchor="middle">CloudTrail</text>
  <text x="321" y="134" font-size="9.5" text-anchor="middle">Config</text>
  <text x="321" y="156" font-size="9.5" text-anchor="middle">GuardDuty</text>
  <text x="321" y="178" font-size="9.5" text-anchor="middle">Security Hub</text>
  <text x="321" y="210" font-size="8.5" text-anchor="middle" fill-opacity="0.75">通信を止める</text>
  <text x="321" y="224" font-size="8.5" text-anchor="middle" fill-opacity="0.75">のではなく</text>
  <text x="321" y="238" font-size="8.5" text-anchor="middle" fill-opacity="0.75">見つけて知らせる</text>
  <line x1="10" y1="346" x2="370" y2="346" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="364" font-size="9.5">1つの層が破られても、次の層で止める</text>
  <text x="10" y="380" font-size="8.5" fill-opacity="0.8">WAFはCloudFront・ALB・API Gatewayに付ける（NLBやEC2には付かない）</text>
</svg>