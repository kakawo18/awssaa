<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" role="img" aria-label="DR戦略の4類型。上から順にバックアップとリストア、パイロットライト、ウォームスタンバイ、マルチサイト。下にいくほど復旧が速くコストが高い。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor" color="#1B212E">
  <rect width="100%" height="100%" rx="10" fill="#FFFFFF"/>
  <text x="10" y="22" font-size="10.5" fill-opacity="0.72">復旧は遅い ／ コストは安い</text>
  <text x="10" y="292" font-size="10.5" fill-opacity="0.72">復旧は速い ／ コストは高い</text>

  <line x1="34" y1="36" x2="34" y2="272" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.6"/>
  <polygon points="34,30 30,40 38,40" fill="currentColor" fill-opacity="0.45"/>
  <polygon points="34,278 30,268 38,268" fill="currentColor" fill-opacity="0.45"/>

  <circle cx="34" cy="72" r="7" fill="#3F78D8"/>
  <text x="52" y="70" font-size="12.5">バックアップ＆リストア</text>
  <text x="52" y="87" font-size="10.5" fill-opacity="0.75">RTO 数時間〜数日／保管するだけ</text>

  <circle cx="34" cy="132" r="7" fill="#3F78D8"/>
  <text x="52" y="130" font-size="12.5">パイロットライト</text>
  <text x="52" y="147" font-size="10.5" fill-opacity="0.75">RTO 数十分／DBだけ複製して待機</text>

  <circle cx="34" cy="192" r="7" fill="#3F78D8"/>
  <text x="52" y="190" font-size="12.5">ウォームスタンバイ</text>
  <text x="52" y="207" font-size="10.5" fill-opacity="0.75">RTO 数分／縮小版が常時稼働</text>

  <circle cx="34" cy="252" r="7" fill="#3F78D8"/>
  <text x="52" y="250" font-size="12.5">マルチサイト（Active/Active）</text>
  <text x="52" y="267" font-size="10.5" fill-opacity="0.75">RTO ほぼゼロ／両リージョンで本番稼働</text>
</svg>