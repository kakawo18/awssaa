<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" role="img" aria-label="DynamoDBのパーティション。項目はパーティションキーのハッシュで置き場所が決まる。機器IDのように種類の多いキーなら負荷が全パーティションに分散するが、当日の日付のように同じ値に書き込みが集まるキーでは1つのパーティションに集中してスロットリングが起きる。GSIは別のキーで並べ直したもう1つの表で、書き込み時に自動で複製される。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor" color="#1B212E">
  <rect width="100%" height="100%" rx="10" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-ddb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
  </defs>
  <text x="10" y="18" font-size="10.5" fill-opacity="0.7">パーティションキーのハッシュで置き場所が決まる</text>
  <g font-size="9.5" text-anchor="middle" fill-opacity="0.75">
    <text x="214" y="38">P1</text><text x="268" y="38">P2</text><text x="322" y="38">P3</text>
  </g>

  <!-- good key -->
  <text x="10" y="62" font-size="10.5">キー＝機器ID</text>
  <text x="10" y="77" font-size="9" fill-opacity="0.7">（値の種類が多い）</text>
  <g fill="#3F78D8" fill-opacity="0.35" stroke="#3F78D8" stroke-width="1.2">
    <rect x="194" y="58" width="40" height="28" rx="3"/><rect x="248" y="58" width="40" height="28" rx="3"/><rect x="302" y="58" width="40" height="28" rx="3"/>
  </g>
  <text x="352" y="76" font-size="11" font-weight="700">✓</text>
  <text x="194" y="100" font-size="9.5" fill-opacity="0.8">書き込みが均等に分かれる</text>

  <!-- bad key -->
  <text x="10" y="128" font-size="10.5">キー＝当日の日付</text>
  <text x="10" y="143" font-size="9" fill-opacity="0.7">（今日の値に集中）</text>
  <rect x="194" y="114" width="40" height="28" rx="3" fill="#3F78D8" fill-opacity="0.9" stroke="#3F78D8" stroke-width="1.2"/>
  <rect x="248" y="114" width="40" height="28" rx="3" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.45"/>
  <rect x="302" y="114" width="40" height="28" rx="3" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.45"/>
  <text x="352" y="132" font-size="11" font-weight="700">✕</text>
  <text x="194" y="156" font-size="9.5" fill-opacity="0.8">P1だけが上限に達してスロットリング</text>

  <line x1="10" y1="172" x2="370" y2="172" stroke="currentColor" stroke-opacity="0.2"/>

  <!-- GSI -->
  <text x="10" y="192" font-size="10.5">GSI：別のキーで並べ直した、もう1つの表</text>
  <rect x="10" y="204" width="150" height="62" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="85" y="222" text-anchor="middle" font-size="10.5">テーブル</text>
  <text x="85" y="239" text-anchor="middle" font-size="9.5">キー：注文ID</text>
  <text x="85" y="254" text-anchor="middle" font-size="9" fill-opacity="0.7">顧客IDで探すとScan</text>
  <rect x="216" y="204" width="154" height="62" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="293" y="222" text-anchor="middle" font-size="10.5">GSI</text>
  <text x="293" y="239" text-anchor="middle" font-size="9.5">キー：顧客ID＋注文日</text>
  <text x="293" y="254" text-anchor="middle" font-size="9" fill-opacity="0.8">顧客IDでQueryできる</text>
  <line x1="160" y1="235" x2="212" y2="235" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-ddb)"/>
  <text x="186" y="228" text-anchor="middle" font-size="8.5" fill-opacity="0.8">自動で複製</text>

  <!-- notes -->
  <text x="10" y="288" font-size="10">GSIは作成後でも追加でき、読み取りは結果整合性のみ。</text>
  <text x="10" y="304" font-size="10">GSIの書き込み容量が足りないと、元の表の書き込みも詰まる。</text>
  <text x="10" y="324" font-size="9.5" fill-opacity="0.75">LSIは同じパーティションキーで別のソートキー（表の作成時のみ）</text>
</svg>