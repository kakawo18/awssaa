<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" role="img" aria-label="ECSの2つのIAMロール。タスク実行ロールはECSエージェントやFargateの基盤が使い、ECRからのイメージ取得、CloudWatch Logsへのログ送信、Secrets Managerからの秘密情報の取得を行う。タスクロールはコンテナの中のアプリが使い、S3やDynamoDBなどのAPIを呼び出す。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor" color="#1B212E">
  <rect width="100%" height="100%" rx="10" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-ecs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
  </defs>

  <!-- task frame -->
  <rect x="10" y="8" width="360" height="92" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.45"/>
  <text x="18" y="24" font-size="10" fill-opacity="0.7">ECSタスク</text>
  <rect x="22" y="34" width="150" height="54" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="4 3"/>
  <text x="97" y="55" text-anchor="middle" font-size="10">ECSエージェント／</text>
  <text x="97" y="70" text-anchor="middle" font-size="10">Fargateの基盤</text>
  <text x="97" y="83" text-anchor="middle" font-size="8.5" fill-opacity="0.7">起動の準備をする側</text>
  <rect x="208" y="34" width="150" height="54" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="283" y="57" text-anchor="middle" font-size="10.5">コンテナの中のアプリ</text>
  <text x="283" y="75" text-anchor="middle" font-size="8.5" fill-opacity="0.75">業務の処理をする側</text>

  <!-- role badges -->
  <rect x="34" y="114" width="126" height="26" rx="13" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.6"/>
  <text x="97" y="131" text-anchor="middle" font-size="10.5">タスク実行ロール</text>
  <rect x="220" y="114" width="126" height="26" rx="13" fill="#3F78D8" fill-opacity="0.22" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="283" y="131" text-anchor="middle" font-size="10.5">タスクロール</text>
  <line x1="97" y1="88" x2="97" y2="110" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4"/>
  <line x1="283" y1="88" x2="283" y2="110" stroke="#3F78D8" stroke-width="1.6"/>

  <!-- targets: execution role -->
  <g font-size="9.5">
    <rect x="12" y="168" width="168" height="26" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.45"/>
    <text x="20" y="185">ECR：イメージを取得</text>
    <rect x="12" y="200" width="168" height="26" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.45"/>
    <text x="20" y="217">CloudWatch Logs：ログ送信</text>
    <rect x="12" y="232" width="168" height="26" rx="5" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.45"/>
    <text x="20" y="249">Secrets Manager：秘密情報</text>
  </g>
  <line x1="97" y1="140" x2="97" y2="164" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4" marker-end="url(#arw-ecs)"/>

  <!-- targets: task role -->
  <g font-size="9.5">
    <rect x="200" y="168" width="168" height="26" rx="5" fill="#3F78D8" fill-opacity="0.08" stroke="#3F78D8" stroke-opacity="0.8"/>
    <text x="208" y="185">S3：ファイルの読み書き</text>
    <rect x="200" y="200" width="168" height="26" rx="5" fill="#3F78D8" fill-opacity="0.08" stroke="#3F78D8" stroke-opacity="0.8"/>
    <text x="208" y="217">DynamoDB・SQSなど</text>
    <text x="208" y="246" fill-opacity="0.75">アプリが呼ぶAWSのAPI</text>
  </g>
  <line x1="283" y1="140" x2="283" y2="164" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-ecs)"/>

  <!-- diagnosis -->
  <line x1="10" y1="274" x2="370" y2="274" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="292" font-size="10.5">イメージ取得・ログ出力で失敗 → タスク実行ロールを直す</text>
  <text x="10" y="311" font-size="10.5">アプリのS3呼び出しでAccessDenied → タスクロールを直す</text>
</svg>