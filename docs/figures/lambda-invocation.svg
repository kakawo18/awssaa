<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" role="img" aria-label="Lambdaの3つの呼び出し方式と失敗時の動き。同期呼び出しはAPI GatewayやALBからで、失敗は呼び出し元にエラーとして返る。非同期呼び出しはS3、SNS、EventBridgeからで、Lambdaが2回まで再試行し、それでも失敗したイベントはDLQか送信先に送る。ポーリングはSQSやKinesisからで、失敗したメッセージはキューに戻って再配信され、Kinesisではそのシャードの処理が止まる。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor" color="#1B212E">
  <rect width="100%" height="100%" rx="10" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
    <marker id="arw-li-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity="0.65"/>
    </marker>
  </defs>

  <!-- sync -->
  <text x="10" y="18" font-size="11">同期</text>
  <text x="44" y="18" font-size="9.5" fill-opacity="0.7">API Gateway・ALB</text>
  <rect x="10" y="28" width="96" height="30" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="58" y="47" text-anchor="middle" font-size="10">呼び出し元</text>
  <rect x="160" y="28" width="70" height="30" rx="5" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="195" y="47" text-anchor="middle" font-size="10">Lambda</text>
  <line x1="106" y1="38" x2="156" y2="38" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-li)"/>
  <line x1="160" y1="50" x2="110" y2="50" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw-li-g)"/>
  <text x="240" y="40" font-size="9.5">失敗はエラーとして</text>
  <text x="240" y="53" font-size="9.5">呼び出し元へ返る</text>
  <text x="240" y="66" font-size="9" fill-opacity="0.7">再試行は呼び出し元の責任</text>

  <line x1="10" y1="82" x2="370" y2="82" stroke="currentColor" stroke-opacity="0.2"/>

  <!-- async -->
  <text x="10" y="102" font-size="11">非同期</text>
  <text x="56" y="102" font-size="9.5" fill-opacity="0.7">S3・SNS・EventBridge</text>
  <rect x="10" y="112" width="70" height="30" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="45" y="131" text-anchor="middle" font-size="10">イベント</text>
  <rect x="96" y="112" width="60" height="30" rx="5" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <text x="126" y="131" text-anchor="middle" font-size="9">内部キュー</text>
  <rect x="172" y="112" width="70" height="30" rx="5" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="207" y="131" text-anchor="middle" font-size="10">Lambda</text>
  <rect x="270" y="112" width="100" height="30" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4"/>
  <text x="320" y="125" text-anchor="middle" font-size="9.5">DLQ／送信先</text>
  <text x="320" y="137" text-anchor="middle" font-size="8.5" fill-opacity="0.75">（onFailure）</text>
  <line x1="80" y1="127" x2="92" y2="127" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-li)"/>
  <line x1="156" y1="127" x2="168" y2="127" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-li)"/>
  <line x1="242" y1="127" x2="266" y2="127" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw-li-g)"/>
  <path d="M190,142 C190,160 224,160 224,146" fill="none" stroke="#3F78D8" stroke-width="1.3" marker-end="url(#arw-li)"/>
  <text x="172" y="170" font-size="9.5">失敗したら2回まで再試行</text>
  <text x="172" y="183" font-size="9" fill-opacity="0.75">それでも失敗 → DLQ／送信先へ</text>
  <text x="10" y="170" font-size="9" fill-opacity="0.75">設定しないと</text>
  <text x="10" y="183" font-size="9" fill-opacity="0.75">イベントは失われる</text>

  <line x1="10" y1="198" x2="370" y2="198" stroke="currentColor" stroke-opacity="0.2"/>

  <!-- poll -->
  <text x="10" y="218" font-size="11">ポーリング</text>
  <text x="74" y="218" font-size="9.5" fill-opacity="0.7">SQS・Kinesis・DynamoDB Streams</text>
  <rect x="10" y="228" width="96" height="30" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="58" y="247" text-anchor="middle" font-size="10">キュー／ストリーム</text>
  <rect x="160" y="228" width="70" height="30" rx="5" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="195" y="247" text-anchor="middle" font-size="10">Lambda</text>
  <line x1="156" y1="243" x2="110" y2="243" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-li)"/>
  <text x="114" y="236" font-size="8.5" fill-opacity="0.8">取りに行く</text>
  <text x="240" y="240" font-size="9.5">失敗した分は</text>
  <text x="240" y="253" font-size="9.5">キュー／ストリームに残る</text>

  <!-- notes -->
  <text x="10" y="284" font-size="10">SQS：再配信され、maxReceiveCountを超えたらDLQへ</text>
  <text x="10" y="302" font-size="10">Kinesis：失敗したレコードでそのシャードの処理が止まる</text>
  <text x="26" y="318" font-size="9.5" fill-opacity="0.75">（バッチの分割や再試行回数の上限を設定して回避）</text>
</svg>