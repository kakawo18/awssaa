<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 350" role="img" aria-label="複製とバックアップの違い。マルチAZのスタンバイやリードレプリカは今の状態を写すため、プライマリで実行したDROP TABLEもすぐに複製され、どちらからもテーブルが消える。自動バックアップのポイントインタイムリカバリは、削除の直前の時点を指定して新しいDBインスタンスとして復元できる。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor" color="#1B212E">
  <rect width="100%" height="100%" rx="10" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-rb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
    <marker id="arw-rb-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity="0.65"/>
    </marker>
  </defs>
  <text x="10" y="16" font-size="10.5" fill-opacity="0.7">管理者が誤って DROP TABLE を実行したら</text>
  <text x="10" y="40" font-size="10.5">複製（マルチAZ・リードレプリカ）＝ 今の状態を写す</text>
  <rect x="10" y="52" width="100" height="40" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="60" y="70" font-size="10.5" text-anchor="middle">プライマリ</text>
  <text x="60" y="84" font-size="8.5" text-anchor="middle" fill-opacity="0.8">DROP TABLE</text>
  <rect x="250" y="50" width="120" height="30" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="310" y="69" font-size="10" text-anchor="middle">スタンバイ</text>
  <rect x="250" y="88" width="120" height="30" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="310" y="107" font-size="10" text-anchor="middle">リードレプリカ</text>
  <line x1="110" y1="66" x2="246" y2="65" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-rb)"/>
  <line x1="110" y1="78" x2="246" y2="101" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-rb)"/>
  <text x="180" y="58" font-size="8.5" text-anchor="middle" fill-opacity="0.8">同期で複製</text>
  <text x="170" y="104" font-size="8.5" text-anchor="middle" fill-opacity="0.8">非同期で複製</text>
  <text x="10" y="138" font-size="10" font-weight="700">✕ スタンバイからもレプリカからもテーブルが消える</text>
  <line x1="10" y1="152" x2="370" y2="152" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="174" font-size="10.5">バックアップ（自動バックアップ＋PITR）＝ 過去に戻る</text>
  <line x1="30" y1="222" x2="350" y2="222" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.2"/>
  <line x1="40" y1="218" x2="40" y2="226" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="40" y="240" font-size="9" text-anchor="middle" fill-opacity="0.8">9:00</text>
  <line x1="140" y1="218" x2="140" y2="226" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="140" y="240" font-size="9" text-anchor="middle" fill-opacity="0.8">9:30</text>
  <line x1="240" y1="218" x2="240" y2="226" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="240" y="240" font-size="9" text-anchor="middle" fill-opacity="0.8">10:00</text>
  <line x1="340" y1="218" x2="340" y2="226" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="340" y="240" font-size="9" text-anchor="middle" fill-opacity="0.8">10:30</text>
  <rect x="40" y="206" width="196" height="12" rx="2" fill="#3F78D8" fill-opacity="0.3" stroke="#3F78D8"/>
  <text x="138" y="200" font-size="8.5" text-anchor="middle" fill-opacity="0.85">バックアップと変更ログ</text>
  <line x1="240" y1="190" x2="240" y2="222" stroke="currentColor" stroke-width="2"/>
  <text x="245" y="204" font-size="9" font-weight="700">DROP TABLE</text>
  <line x1="320" y1="200" x2="320" y2="222" stroke="currentColor" stroke-opacity="0.6" stroke-dasharray="3 2"/>
  <text x="334" y="196" font-size="8.5" text-anchor="middle" fill-opacity="0.8">気づく</text>
  <path d="M320,248 C300,268 252,268 239,250" fill="none" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-rb)"/>
  <text x="10" y="290" font-size="9.5">削除の直前（9:59）を指定し、新しいDBとして復元する</text>
  <text x="10" y="312" font-size="10" font-weight="700">✓ 消える前のテーブルが戻る</text>
  <line x1="10" y1="324" x2="370" y2="324" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="342" font-size="9" fill-opacity="0.8">複製はAZやリージョンの障害に、バックアップは時間を戻す障害に効く</text>
</svg>