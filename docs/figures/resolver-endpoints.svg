<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" role="img" aria-label="Route 53 Resolverの2つのエンドポイント。オンプレミスからAWSの名前を引くときは、オンプレミスのDNSサーバーがVPC内のインバウンドエンドポイントへ問い合わせを転送する。VPCからオンプレミスの名前を引くときは、転送ルールに従ってアウトバウンドエンドポイントからオンプレミスのDNSサーバーへ転送する。どちらもDirect ConnectやVPNの経路が必要。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor" color="#1B212E">
  <rect width="100%" height="100%" rx="10" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-rs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
  </defs>

  <!-- frames -->
  <rect x="10" y="30" width="100" height="208" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.45"/>
  <text x="60" y="22" text-anchor="middle" font-size="10.5">オンプレミス</text>
  <rect x="150" y="30" width="220" height="208" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.45"/>
  <text x="260" y="22" text-anchor="middle" font-size="10.5">VPC</text>
  <line x1="110" y1="134" x2="150" y2="134" stroke="currentColor" stroke-opacity="0.35" stroke-width="6"/>
  <text x="130" y="252" text-anchor="middle" font-size="9.5" fill-opacity="0.75">DX／VPN</text>
  <line x1="130" y1="140" x2="130" y2="242" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="2 3"/>

  <!-- on-prem DNS -->
  <rect x="20" y="104" width="80" height="60" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="60" y="128" text-anchor="middle" font-size="10.5">DNSサーバー</text>
  <text x="60" y="144" text-anchor="middle" font-size="9" fill-opacity="0.7">corp.local を</text>
  <text x="60" y="156" text-anchor="middle" font-size="9" fill-opacity="0.7">管理</text>

  <!-- VPC parts -->
  <rect x="164" y="48" width="96" height="36" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="212" y="63" text-anchor="middle" font-size="10">インバウンド</text>
  <text x="212" y="77" text-anchor="middle" font-size="10">エンドポイント</text>
  <rect x="164" y="184" width="96" height="36" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="212" y="199" text-anchor="middle" font-size="10">アウトバウンド</text>
  <text x="212" y="213" text-anchor="middle" font-size="10">エンドポイント</text>
  <rect x="282" y="104" width="80" height="60" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="322" y="124" text-anchor="middle" font-size="10">Route 53</text>
  <text x="322" y="138" text-anchor="middle" font-size="10">Resolver</text>
  <text x="322" y="154" text-anchor="middle" font-size="9" fill-opacity="0.7">転送ルール</text>
  <rect x="282" y="48" width="80" height="36" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="4 3"/>
  <text x="322" y="63" text-anchor="middle" font-size="9.5">プライベート</text>
  <text x="322" y="77" text-anchor="middle" font-size="9.5">ホストゾーン</text>
  <rect x="282" y="184" width="80" height="36" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="322" y="206" text-anchor="middle" font-size="10.5">EC2</text>

  <!-- inbound flow: on-prem -> inbound endpoint -> resolver (-> PHZ) -->
  <polyline points="60,104 60,66 160,66" fill="none" stroke="#3F78D8" stroke-width="1.8" marker-end="url(#arw-rs)"/>
  <line x1="260" y1="74" x2="296" y2="104" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-rs)"/>
  <line x1="322" y1="104" x2="322" y2="88" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#arw-rs)"/>
  <text x="68" y="58" font-size="9.5">① 問い合わせ</text>

  <!-- outbound flow: EC2 -> resolver -> outbound endpoint -> on-prem -->
  <line x1="322" y1="184" x2="322" y2="168" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-rs)"/>
  <line x1="296" y1="164" x2="262" y2="190" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-rs)"/>
  <polyline points="164,202 60,202 60,168" fill="none" stroke="#3F78D8" stroke-width="1.8" marker-end="url(#arw-rs)"/>
  <text x="68" y="222" font-size="9.5">② 転送</text>

  <!-- notes -->
  <line x1="10" y1="266" x2="370" y2="266" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="284" font-size="10.5">① オンプレミス → AWSの名前：インバウンド（AWSへ入る）</text>
  <text x="10" y="302" font-size="10.5">② VPC → オンプレミスの名前：アウトバウンド（AWSから出る）</text>
  <text x="10" y="318" font-size="9.5" fill-opacity="0.75">名前解決だけを中継する。通信そのものにはDX／VPNの経路が別に必要</text>
</svg>