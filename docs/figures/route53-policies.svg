<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" role="img" aria-label="Route 53の主なルーティングポリシーの動き。フェイルオーバーはヘルスチェックで異常になったプライマリの代わりにスタンバイを返す。加重は指定した比率で振り分ける。レイテンシーは利用者から遅延が最も小さいリージョンを返す。位置情報は利用者の国や地域で返す先を決める。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor" color="#1B212E">
  <rect width="100%" height="100%" rx="10" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-r5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
    <marker id="arw-r5-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity="0.65"/>
    </marker>
  </defs>
  <rect x="10" y="8" width="175" height="118" rx="6" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.4"/>
  <text x="18" y="24" font-size="10.5">フェイルオーバー</text>
  <rect x="20" y="34" width="60" height="24" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="50" y="50" font-size="9.5" text-anchor="middle">DNS</text>
  <rect x="100" y="30" width="76" height="26" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="3 2"/>
  <text x="138" y="47" font-size="9.5" text-anchor="middle">プライマリ</text>
  <rect x="100" y="72" width="76" height="26" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="138" y="89" font-size="9.5" text-anchor="middle">スタンバイ</text>
  <line x1="80" y1="44" x2="96" y2="43" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arw-r5-g)"/>
  <line x1="80" y1="52" x2="96" y2="80" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-r5)"/>
  <text x="18" y="78" font-size="8" fill-opacity="0.8">ヘルスチェック</text>
  <text x="18" y="90" font-size="8" fill-opacity="0.8">が異常 → 切替</text>
  <text x="18" y="116" font-size="8" fill-opacity="0.75">切り替えはTTL分遅れる</text>
  <rect x="195" y="8" width="175" height="118" rx="6" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.4"/>
  <text x="203" y="24" font-size="10.5">加重</text>
  <rect x="205" y="52" width="50" height="24" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="230" y="68" font-size="9.5" text-anchor="middle">DNS</text>
  <rect x="290" y="30" width="76" height="26" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="328" y="47" font-size="9.5" text-anchor="middle">旧版 90%</text>
  <rect x="290" y="72" width="76" height="26" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="328" y="89" font-size="9.5" text-anchor="middle">新版 10%</text>
  <line x1="255" y1="60" x2="286" y2="44" stroke="currentColor" stroke-opacity="0.65" stroke-width="2.4" marker-end="url(#arw-r5-g)"/>
  <line x1="255" y1="68" x2="286" y2="84" stroke="#3F78D8" stroke-width="1.1" marker-end="url(#arw-r5)"/>
  <text x="203" y="116" font-size="8" fill-opacity="0.75">比率を変えて段階的に移す</text>
  <rect x="10" y="136" width="175" height="118" rx="6" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.4"/>
  <text x="18" y="152" font-size="10.5">レイテンシー</text>
  <rect x="20" y="170" width="56" height="24" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="48" y="186" font-size="9.5" text-anchor="middle">利用者</text>
  <text x="48" y="208" font-size="8" text-anchor="middle" fill-opacity="0.75">（東京）</text>
  <rect x="100" y="158" width="76" height="26" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="138" y="175" font-size="9.5" text-anchor="middle">東京 20ms</text>
  <rect x="100" y="200" width="76" height="26" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="138" y="217" font-size="9.5" text-anchor="middle">米国 150ms</text>
  <line x1="76" y1="178" x2="96" y2="172" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-r5)"/>
  <line x1="76" y1="188" x2="96" y2="210" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="18" y="244" font-size="8" fill-opacity="0.75">測った遅延が小さい方</text>
  <rect x="195" y="136" width="175" height="118" rx="6" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.4"/>
  <text x="203" y="152" font-size="10.5">位置情報</text>
  <rect x="205" y="158" width="62" height="24" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="236" y="174" font-size="9.5" text-anchor="middle">日本から</text>
  <rect x="205" y="200" width="62" height="24" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="236" y="216" font-size="9.5" text-anchor="middle">その他</text>
  <rect x="290" y="158" width="76" height="26" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="328" y="175" font-size="9" text-anchor="middle">日本語サイト</text>
  <rect x="290" y="200" width="76" height="26" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="328" y="217" font-size="9" text-anchor="middle">既定のサイト</text>
  <line x1="267" y1="170" x2="286" y2="171" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-r5)"/>
  <line x1="267" y1="212" x2="286" y2="213" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-r5-g)"/>
  <text x="203" y="244" font-size="8" fill-opacity="0.75">国・地域で決める（法規制・言語）</text>
  <line x1="10" y1="266" x2="370" y2="266" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="284" font-size="9" fill-opacity="0.85">DNSが返すのは宛先のIPだけ。URLのパスでは振り分けられない（→ALB）</text>
</svg>