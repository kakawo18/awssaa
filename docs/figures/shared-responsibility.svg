<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 296" role="img" aria-label="サービスごとの責任の境目。EC2ではOSから上を利用者が管理する。RDSではOSとDBエンジンをAWSが管理し、利用者はデータとアクセス権限を管理する。Lambdaでは利用者がコードとデータとアクセス権限を管理する。S3では利用者がデータとアクセス権限を管理する。どのサービスでも、データとアクセス権限は利用者の責任になる。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor" color="#1B212E">
