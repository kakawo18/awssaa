<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" role="img" aria-label="Step FunctionsでのRetryとCatchとSaga。注文処理は在庫の確保、決済、発送の順に進む。決済の一時的な失敗はRetryで再試行する。再試行しても失敗したらCatchで取り消しの手順へ進み、決済が失敗したら在庫を戻し、発送が失敗したら返金してから在庫を戻す。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor" color="#1B212E">
  <rect width="100%" height="100%" rx="10" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-sf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
    <marker id="arw-sf-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity="0.65"/>
    </marker>
  </defs>
  <text x="10" y="18" font-size="10.5" fill-opacity="0.7">通常の流れ</text>

  <!-- happy path -->
  <g font-size="10" text-anchor="middle">
    <rect x="10" y="34" width="76" height="34" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
    <text x="48" y="55">在庫を確保</text>
    <rect x="108" y="34" width="76" height="34" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
    <text x="146" y="55">決済</text>
    <rect x="206" y="34" width="76" height="34" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
    <text x="244" y="55">発送</text>
    <rect x="304" y="34" width="66" height="34" rx="17" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="337" y="55">完了</text>
  </g>
  <line x1="86" y1="51" x2="104" y2="51" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-sf)"/>
  <line x1="184" y1="51" x2="202" y2="51" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-sf)"/>
  <line x1="282" y1="51" x2="300" y2="51" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-sf)"/>

  <!-- retry loop on payment -->
  <path d="M130,34 C130,14 162,14 162,30" fill="none" stroke="#3F78D8" stroke-width="1.3" marker-end="url(#arw-sf)"/>
  <text x="146" y="12" text-anchor="middle" font-size="9">Retry</text>

  <!-- catch arrows -->
  <line x1="146" y1="68" x2="146" y2="132" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw-sf-g)"/>
  <text x="152" y="100" font-size="9">Catch</text>
  <line x1="244" y1="68" x2="244" y2="132" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw-sf-g)"/>
  <text x="250" y="100" font-size="9">Catch</text>

  <!-- compensation path -->
  <text x="10" y="126" font-size="10.5" fill-opacity="0.7">取り消し（補償）の流れ</text>
  <g font-size="10" text-anchor="middle">
    <rect x="206" y="136" width="76" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.3"/>
    <text x="244" y="157">返金</text>
    <rect x="108" y="136" width="76" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.3"/>
    <text x="146" y="157">在庫を戻す</text>
    <rect x="10" y="136" width="76" height="34" rx="17" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="48" y="157">失敗を通知</text>
  </g>
  <line x1="206" y1="153" x2="188" y2="153" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-sf-g)"/>
  <line x1="108" y1="153" x2="90" y2="153" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-sf-g)"/>

  <!-- notes -->
  <line x1="10" y1="190" x2="370" y2="190" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="208" font-size="10.5">Retry：一時的な失敗（タイムアウトなど）を、間隔を</text>
  <text x="26" y="224" font-size="10.5">あけて自動で再試行する</text>
  <text x="10" y="244" font-size="10.5">Catch：再試行しても失敗したら、別の手順へ進める</text>
  <text x="10" y="264" font-size="10.5">Saga：完了済みの手順を、逆の順に取り消していく</text>
  <text x="10" y="288" font-size="9.5" fill-opacity="0.75">状態と分岐はステートマシンが持つので、自前で作り込まない</text>
</svg>