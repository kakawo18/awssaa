<title>SAA 判断ポイント</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 配色は青と黄の2色相のみ（第1・第2色覚でも判別可能）。
   意味は色だけでなく、帯・罫線・記号・太さでも重ねて示す。
   本文・補助文字とも WCAG AAA（7:1）以上を確保。 */
:root{
  --fs:17px;
  --paper:#F5F7FA; --surface:#FFFFFF; --surface-2:#E9EDF3; --tint:#E8EEF9;
  --ink:#1B212E; --ink-strong:#04070D; --ink-mute:#454C5A;
  --rule:#C4CCD9; --rule-2:#7D8798;
  --accent:#14488F; --accent-weak:#D2E0F5;
  --mark-bg:#FFDE7A; --mark-ink:#241900; --mark-line:#9A6B00;
  --ok:#0A5C4B; --ok-weak:#E7F3EF; --ng:#932C19; --ng-weak:#FBEBE6;
  --shadow:0 1px 1px rgba(4,7,13,.05);
  --head:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --body:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1218; --surface:#161B23; --surface-2:#1D232D; --tint:#1A2332;
  --ink:#E2E8F1; --ink-strong:#FFFFFF; --ink-mute:#AEB7C4;
  --rule:#363E4C; --rule-2:#626D7D;
  --accent:#A9C6FF; --accent-weak:#1B2740;
  --mark-bg:#F7D774; --mark-ink:#1A1400; --mark-line:#8A6A12;
  --ok:#4FC3A8; --ok-weak:#13302A; --ng:#F0907A; --ng-weak:#33211C;
  --shadow:0 1px 1px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --paper:#0E1218; --surface:#161B23; --surface-2:#1D232D; --tint:#1A2332;
  --ink:#E2E8F1; --ink-strong:#FFFFFF; --ink-mute:#AEB7C4;
  --rule:#363E4C; --rule-2:#626D7D;
  --accent:#A9C6FF; --accent-weak:#1B2740;
  --mark-bg:#F7D774; --mark-ink:#1A1400; --mark-line:#8A6A12;
  --ok:#4FC3A8; --ok-weak:#13302A; --ng:#F0907A; --ng-weak:#33211C;
  --shadow:0 1px 1px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:var(--fs);line-height:1.9;letter-spacing:.01em;
  -webkit-text-size-adjust:100%;font-feature-settings:"palt" 1}
b{font-weight:700;color:var(--ink-strong)}
code{font-family:var(--mono);font-size:.88em;color:var(--ink-strong);background:var(--surface-2);
  padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
/* 検索ハイライトは地色だけでなく下線でも示す（色の見え方に依存させない） */
mark{background:var(--mark-bg);color:var(--mark-ink);padding:0 .2em;border-radius:2px;
  font-weight:700;box-shadow:inset 0 -2px 0 var(--mark-line)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---- header ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule-2)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--head);font-weight:700;font-size:16px;
  color:var(--ink-strong);cursor:pointer;white-space:nowrap}
.brand .mk{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;
  color:var(--accent);border:1px solid var(--accent);padding:1px 5px;border-radius:3px}
.search{flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--rule-2);border-radius:8px;padding:7px 12px}
.search input{flex:1;min-width:0;border:none;background:none;font:inherit;font-size:15px;
  color:var(--ink-strong);outline:none}
.search svg{flex:none;color:var(--ink-mute)}
.iconbtn{flex:none;border:1px solid var(--rule-2);background:var(--surface);border-radius:8px;
  padding:7px 12px;font-size:13.5px;font-family:var(--head);font-weight:600;color:var(--ink-strong)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn,.size-btn{display:flex;align-items:center;gap:6px;padding:7px 10px}
.theme-btn .ti,.size-btn .ti{display:flex;color:var(--accent)}
@media(min-width:900px){.menu-btn{display:none}}
body:not([data-view="read"]) .menu-btn{display:none}
@media(max-width:560px){
  .top-in{gap:8px}
  .brand{flex:1 1 auto}
  .brand span:last-child{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .search{order:3;flex-basis:100%}
}

/* ---- shell ---- */
.shell{max-width:1120px;margin:0 auto;padding:26px 16px 80px;display:grid;gap:28px;grid-template-columns:1fr}
@media(min-width:900px){body[data-view="read"] .shell{grid-template-columns:240px minmax(0,1fr);gap:48px;padding-top:34px}}
body:not([data-view="read"]) .shell{max-width:880px}
body:not([data-view="read"]) .nav{display:none}
@media(max-width:899px){.shell{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}}

/* ---- nav ---- */
.nav{align-self:start}
@media(min-width:900px){.nav{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}}
@media(max-width:899px){.nav{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:8px}}
.navgrp{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;
  color:var(--ink-mute);margin:18px 0 6px 12px}
.navgrp:first-child{margin-top:4px}
.navlink{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;
  border-left:3px solid transparent;line-height:1.55;font-size:14px;color:var(--ink)}
.navlink:hover{background:var(--surface-2);color:var(--ink-strong)}
.navlink[aria-current="true"]{background:var(--accent-weak);border-left-color:var(--accent);
  color:var(--ink-strong);font-weight:700}
.navlink .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-mute);flex:none;width:3.4em;white-space:nowrap}
.navlink[aria-current="true"] .n{color:var(--ink-strong)}
/* 読了は色ではなく「塗りつぶし／輪郭のみ」の差で示す */
.navlink .dot{margin-left:auto;width:9px;height:9px;border-radius:50%;flex:none;background:transparent;
  border:2px solid var(--rule-2)}
.navlink.done .dot{background:var(--accent);border-color:var(--accent)}

/* ---- content ---- */
main{min-width:0}
.sec p,.sec ul,.sec ol,.lead,.note,.lede,.empty,.hero,.axes{max-width:740px}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--accent)}
h1{font-family:var(--head);font-weight:700;font-size:clamp(26px,5.6vw,34px);line-height:1.35;
  margin:8px 0 0;color:var(--ink-strong);text-wrap:balance}
.lead{margin:18px 0 0;padding:15px 18px;background:var(--surface);border:1px solid var(--rule);
  border-left:4px solid var(--accent);border-radius:0 8px 8px 0;font-size:.94em;line-height:1.85}
main a{color:var(--accent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
main a[target="_blank"]::after{content:"\2197";font-family:var(--mono);font-size:.8em;margin-left:2px;text-decoration:none;display:inline-block}
.hit .ans a,.hit a{color:inherit;text-decoration:none}
section.sec{margin-top:48px;scroll-margin-top:84px}
h2{font-family:var(--head);font-weight:700;font-size:1.3em;line-height:1.45;margin:0;
  display:flex;gap:11px;align-items:baseline;color:var(--ink-strong);text-wrap:balance;
  padding-bottom:11px;border-bottom:2px solid var(--rule-2)}
h2 .n{font-family:var(--mono);font-size:.62em;font-weight:600;color:var(--accent);flex:none}
h3{font-family:var(--head);font-size:1em;font-weight:700;color:var(--ink-strong);margin:30px 0 0}
.sec p{margin:15px 0 0}
.label{font-family:var(--head);font-weight:700;font-size:.9em;margin:32px 0 0;color:var(--ink-strong);
  display:flex;align-items:flex-start;gap:9px}
.label::before{content:"";width:16px;height:4px;background:var(--accent);border-radius:2px;flex:none;margin-top:.8em}
.lede{margin:18px 0 0;display:flex;gap:13px;align-items:flex-start;background:var(--surface-2);
  border-left:4px solid var(--accent);padding:13px 15px;border-radius:0 8px 8px 0}
.lede .tag{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent);
  border:1px solid currentColor;border-radius:3px;padding:1px 5px;flex:none;margin-top:6px;white-space:nowrap}
.lede div{font-size:.94em;color:var(--ink-strong)}
.note{margin:18px 0 0;padding:13px 15px;background:var(--surface-2);border-radius:8px;
  color:var(--ink);font-size:.9em;line-height:1.85}
.note.info,.note.warn{border-left:4px solid var(--accent)}
.note.warn{border-left-style:double;border-left-width:6px}
.note .nl{display:block;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.06em;
  color:var(--accent);margin-bottom:2px}
.sec ul,.sec ol{margin:14px 0 0;padding-left:1.3em}
.sec li{margin-top:10px}
.sec ul{list-style:none;padding-left:0}
.sec ul>li{position:relative;padding-left:1.2em}
.sec ul>li::before{content:"";position:absolute;left:0;top:.85em;width:9px;height:3px;
  background:var(--accent);border-radius:2px}

/* ---- figures ---- */
.fig{margin:22px 0 0;padding:15px;background:var(--surface);border:1px solid var(--rule);
  border-radius:8px;box-shadow:var(--shadow);max-width:560px}
.fig svg{display:block;width:100%;height:auto;color:var(--ink)}
.qfig{margin-top:14px;box-shadow:none;background:var(--paper)}
.fig figcaption{margin-top:12px;padding-top:11px;border-top:1px solid var(--rule);
  font-size:.84em;line-height:1.8;color:var(--ink)}

/* ---- 問題集（正誤は色だけでなく ✓ / ✕ と語でも示す） ---- */
.quizbar{margin:18px 0 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:var(--surface-2);border-radius:8px;padding:11px 15px;font-size:.86em}
.quizbar b{font-family:var(--mono);font-size:1.08em;color:var(--ink-strong)}
.quizbar .fbtn{margin-left:auto;padding:7px 12px;font-size:.92em}
section.q{margin-top:44px;scroll-margin-top:120px}
.q h2 .lv{margin-left:auto;font-family:var(--mono);font-size:.62em;color:var(--ink-mute);letter-spacing:.12em;flex:none}
.qbody{margin-top:15px;max-width:740px}
.qbody p{margin:11px 0 0}
.opts{margin-top:17px;display:grid;gap:9px;max-width:740px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--rule-2);border-radius:8px;padding:13px 15px;
  font-size:.92em;line-height:1.75;color:var(--ink)}
.opt:hover:not([aria-disabled="true"]){border-color:var(--accent);background:var(--tint)}
.opt>span:not(.mk){min-width:0;overflow-wrap:anywhere}
.opt .ol{flex:none;font-family:var(--mono);font-weight:700;color:var(--accent);min-width:1.3em}
.opt .mk{margin-left:auto;padding-left:10px;font-weight:700;white-space:nowrap;font-size:.92em}
.opt.correct{border-color:var(--ok);border-width:2px;background:var(--ok-weak);padding:12px 14px}
.opt.correct .ol,.opt.correct .mk{color:var(--ok)}
.opt.wrong{border-color:var(--ng);border-width:2px;background:var(--ng-weak);padding:12px 14px}
.opt.wrong .ol,.opt.wrong .mk{color:var(--ng)}
.opt[aria-disabled="true"]{cursor:default}
.opt.picked{border-color:var(--accent);border-width:2px;background:var(--accent-weak);padding:12px 14px}
.opt.picked .mk{color:var(--accent)}
.submitrow{margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:740px}
.submitrow .hint{font-size:.82em;color:var(--ink-mute)}
.submitrow .fbtn[disabled]{opacity:.5;cursor:default;border-color:var(--rule)}
.expl{margin-top:16px;max-width:740px;border:1px solid var(--rule);border-left:4px solid var(--accent);
  border-radius:0 8px 8px 0;background:var(--surface);padding:14px 16px;font-size:.9em;line-height:1.8}
.verdict{font-family:var(--head);font-weight:700;font-size:1.05em;margin-bottom:10px}
.verdict.ok{color:var(--ok)}
.verdict.ng{color:var(--ng)}
.expl .lbl{font-weight:700;color:var(--ink-strong);margin-top:14px}
.expl .req{background:var(--surface-2);border-radius:6px;padding:9px 12px;margin-top:6px}
.expl .lbl:first-of-type{margin-top:0}
.expl .kw{color:var(--accent);font-weight:700}
.expl ul{margin:8px 0 0;padding-left:0;list-style:none}
.expl li{position:relative;padding-left:1.2em;margin-top:8px}
.expl li::before{content:"";position:absolute;left:0;top:.85em;width:9px;height:3px;
  background:var(--rule-2);border-radius:2px}
.expl .refs{margin-top:14px;padding-top:11px;border-top:1px solid var(--rule);color:var(--ink-mute)}

/* ---- decision list (2-column tables) ---- */
.dl{margin:18px 0 0;border:1px solid var(--rule);border-radius:8px;background:var(--surface);
  overflow:hidden;box-shadow:var(--shadow)}
.dl .cap,.row{display:grid;grid-template-columns:1fr 1.05fr}
.dl .cap{background:var(--surface-2);border-bottom:1px solid var(--rule-2)}
.dl .cap span{padding:8px 15px;font-family:var(--mono);font-size:11.5px;font-weight:600;
  letter-spacing:.06em;color:var(--ink-mute)}
.dl .cap span:last-child{color:var(--accent);border-left:3px solid var(--accent)}
.row>*{padding:13px 15px;font-size:.94em;line-height:1.75}
.row+.row>*{border-top:1px solid var(--rule)}
/* 「答え」側は帯＋左罫＋太字の3点で示す */
.row .a{background:var(--tint);border-left:3px solid var(--accent);color:var(--ink-strong);font-weight:700}
@media(max-width:640px){
  .dl .cap{grid-template-columns:1fr}
  .dl .cap span:last-child{display:none}
  .row{grid-template-columns:1fr;background:var(--surface)}
  .row>*{padding:12px 15px 4px}
  .row .a{padding:0 15px 13px 34px;background:none;border-left:none;position:relative}
  .row .a::before{content:"\2192";position:absolute;left:14px;top:0;color:var(--accent);
    font-family:var(--mono);font-size:1em;font-weight:700}
  .row+.row>*:first-child{border-top:1px solid var(--rule)}
  .row+.row>*+*{border-top:none}
  .row:nth-child(even){background:var(--tint)}
}
/* ---- wide tables ---- */
.tw{margin:18px 0 0;overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface);
  box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.92em;min-width:520px}
th{font-family:var(--head);font-weight:700;font-size:.85em;letter-spacing:.02em;text-align:left;
  min-width:7.5em;background:var(--surface-2);color:var(--ink-mute);padding:10px 14px;white-space:nowrap;
  border-bottom:1px solid var(--rule-2)}
td{padding:12px 14px;border-top:1px solid var(--rule);vertical-align:top;line-height:1.75;min-width:7.5em}
tr td:first-child{color:var(--ink-strong);font-weight:700}
tr:first-child td{border-top:none}
tbody tr:nth-child(even) td{background:var(--tint)}
@media(max-width:640px){
  .tw{overflow:visible;border:none;background:none;box-shadow:none;border-radius:0}
  table{min-width:0;display:block}
  thead{display:none}
  tbody{display:block}
  tbody tr{display:block;background:var(--surface);border:1px solid var(--rule);border-radius:8px;
    margin-top:10px;overflow:hidden}
  tbody tr:nth-child(even) td{background:none}
  td{display:block;min-width:0;border:none;padding:12px 15px}
  tr td:first-child{background:var(--surface-2);font-weight:700;color:var(--ink-strong)}
  td+td{border-top:1px solid var(--rule)}
  td:not(:first-child)::before{content:attr(data-l);display:block;font-family:var(--mono);font-size:11.5px;
    font-weight:600;letter-spacing:.06em;color:var(--ink-mute);margin-bottom:3px}
  td:not(:first-child):not([data-l])::before{content:none}
}

/* ---- home ---- */
.hero{padding:6px 0 0}
.axes{margin:20px 0 0;display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);
  border-radius:8px;overflow:hidden;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.axis{background:var(--surface);padding:15px 16px}
.axis .k{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.1em;color:var(--accent)}
.axis .t{font-family:var(--head);font-weight:700;font-size:1em;color:var(--ink-strong);margin-top:2px}
.axis .d{font-size:.86em;color:var(--ink);margin-top:4px;line-height:1.75}
.grid{margin:16px 0 0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule);
  border-radius:8px;padding:14px 16px;box-shadow:var(--shadow);transition:border-color .12s ease}
.card:hover{border-color:var(--accent)}
.card .n{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
.card .t{font-family:var(--head);font-weight:700;font-size:.98em;color:var(--ink-strong);margin-top:2px;line-height:1.55}
.card .m{font-size:.78em;color:var(--ink-mute);margin-top:7px;display:flex;align-items:center;gap:6px}
.card.done .m::after{content:"\2713\FF08\8AAD\4E86\FF09";color:var(--accent);font-size:11.5px;font-weight:700;
  border:1px solid var(--accent);border-radius:3px;padding:0 5px;margin-left:auto}
.secthead{font-family:var(--head);font-weight:700;font-size:.85em;color:var(--ink-mute);margin:34px 0 0;
  display:flex;align-items:center;gap:10px}
.secthead::after{content:"";flex:1;height:1px;background:var(--rule)}

/* ---- footer nav ---- */
.footnav{margin-top:52px;padding-top:22px;border-top:1px solid var(--rule);display:flex;gap:10px;
  flex-wrap:wrap;align-items:center}
.fbtn{border:1px solid var(--rule-2);background:var(--surface);border-radius:8px;padding:11px 15px;
  font-size:.82em;font-family:var(--head);font-weight:600;color:var(--ink-strong)}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn.mark{margin-left:auto}
.fbtn.mark.on{background:var(--accent-weak);border-color:var(--accent);color:var(--ink-strong)}

/* ---- search results ---- */
.rescount{font-size:.82em;color:var(--ink-mute);margin:16px 0 0;font-family:var(--mono)}
.resgrp{margin-top:28px}
.resgrp h3{margin:0 0 8px;font-size:.78em;color:var(--ink-mute);font-family:var(--mono);font-weight:600;letter-spacing:.06em}
.hit{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule);
  border-radius:8px;padding:13px 15px;margin-top:9px;font-size:.92em;line-height:1.8;box-shadow:var(--shadow)}
.hit:hover{border-color:var(--accent)}
.hit .where{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-mute);display:block;margin-bottom:4px}
.hit .ar{color:var(--accent);font-family:var(--mono);font-weight:700;padding:0 .45em}
.hit .ans{color:var(--ink-strong);font-weight:700}
.hit.head{border-left:4px solid var(--accent)}
.hit.head .ht{font-size:1.08em;font-weight:700;color:var(--ink-strong)}
.empty{margin-top:26px;color:var(--ink);font-size:.94em}
/* ---- 読む／解く／復習 の切り替え ---- */
.tabs{display:flex;gap:2px;background:var(--surface-2);border-radius:9px;padding:3px;flex:none}
.tab{display:flex;align-items:center;gap:6px;padding:5px 14px;border-radius:7px;font-family:var(--head);
  font-weight:700;font-size:14px;line-height:1.6;color:var(--ink-mute)}
.tab svg{flex:none}
.tab:hover{color:var(--ink-strong)}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink-strong);box-shadow:0 0 0 1px var(--rule-2)}
.tab[aria-current="page"] svg{color:var(--accent)}
.tabbar{display:none}
@media(max-width:899px){
  .top .tabs{display:none}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);
    gap:4px;background:var(--surface);border-top:1px solid var(--rule-2);
    padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar .tab{flex-direction:column;gap:1px;font-size:12px;padding:5px 4px;justify-content:center}
  .tabbar .tab[aria-current="page"]{background:var(--accent-weak);box-shadow:none}
  body[data-view="play"] .tabbar{display:none}
  body[data-view="play"] .top .search{display:none}
}

/* ---- 共通の部品 ---- */
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.84em;color:var(--ink-mute)}
.meta b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.pbtn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;
  padding:11px 18px;font-family:var(--head);font-weight:700;font-size:.9em}
.pbtn:hover{filter:brightness(1.08)}
.pbtn[disabled]{opacity:.45;cursor:default;filter:none}
.lnk{color:var(--accent);font-size:.86em;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;position:relative;
  box-shadow:inset 0 0 0 1px var(--rule)}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.bar>i.ok{background:var(--ok)}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;border:1px solid currentColor;
  border-radius:3px;padding:0 6px;line-height:1.7;white-space:nowrap;color:var(--ink-mute)}
.chip.go{color:var(--accent)}
.chip.done{color:var(--ok)}
.panel{margin-top:18px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
.panel h3{margin:0;font-size:.92em}
.confirm{margin-top:14px;padding:13px 15px;border:1px solid var(--ng);background:var(--ng-weak);border-radius:8px;
  font-size:.88em;color:var(--ink-strong)}
.empty-state{margin-top:22px;padding:22px 20px;border:1px dashed var(--rule-2);border-radius:10px;
  color:var(--ink);font-size:.92em;max-width:640px}

/* ---- 解く：系統ごとのセット一覧 ---- */
.series{margin-top:34px}
.series-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:8px;border-bottom:2px solid var(--rule-2)}
.series-h h2{border:none;padding:0;font-size:1.06em}
.series-h .sn{font-size:.82em;color:var(--ink-mute)}
.series-h .sc{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
.setrow{display:grid;grid-template-columns:5.2em minmax(0,1fr) 8.5em 5.6em;gap:6px 14px;align-items:center;
  width:100%;text-align:left;padding:12px 6px;border-bottom:1px solid var(--rule);line-height:1.55}
.setrow:hover{background:var(--tint)}
.setrow .no{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.setrow .tt{font-family:var(--head);font-weight:700;color:var(--ink-strong);font-size:.95em;min-width:0}
.setrow .tt small{display:block;font-family:var(--body);font-weight:400;font-size:.8em;color:var(--ink-mute)}
.setrow .pr{display:grid;gap:4px;font-size:11.5px;color:var(--ink-mute);font-family:var(--mono);font-variant-numeric:tabular-nums}
.setrow .st{justify-self:end}
@media(max-width:640px){
  .setrow{grid-template-columns:4.4em minmax(0,1fr) auto}
  .setrow .pr{grid-column:2 / 4}
  .setrow .st{grid-row:1;grid-column:3}
}
.resume{margin-top:22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;
  background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;
  padding:15px 18px}
.resume .k{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.1em;color:var(--accent)}
.resume .t{font-family:var(--head);font-weight:700;color:var(--ink-strong);line-height:1.5}
.resume .d{font-size:.84em;color:var(--ink-mute)}
.resume .pbtn{grid-row:1 / 4;grid-column:2}
@media(max-width:560px){.resume{grid-template-columns:1fr}.resume .pbtn{grid-row:auto;grid-column:auto;justify-self:start;margin-top:8px}}

/* ---- セットの扉 ---- */
.modes{margin-top:22px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.mode{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.mode .k{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.1em;color:var(--accent)}
.mode .t{font-family:var(--head);font-weight:700;color:var(--ink-strong);font-size:1.02em}
.mode .d{font-size:.84em;line-height:1.75;color:var(--ink);flex:1}
.mode .pbtn{align-self:flex-start}
.qlist{margin-top:10px;display:grid;gap:0}
.qrow{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto auto;gap:10px;align-items:center;width:100%;
  text-align:left;padding:9px 6px;border-bottom:1px solid var(--rule);font-size:.9em;line-height:1.55}
.qrow:hover{background:var(--tint)}
.qrow .qn{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--accent)}
.qrow .qt{min-width:0;color:var(--ink-strong)}
.qrow .lv{font-family:var(--mono);font-size:11px;color:var(--ink-mute);letter-spacing:.1em}
.res{font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap;min-width:4.6em;text-align:right}
.res.ok{color:var(--ok)}
.res.ng{color:var(--ng)}
.res.na{color:var(--ink-mute);font-weight:500}

/* ---- 1問ずつ解く画面 ---- */
.pbar{position:sticky;top:calc(var(--hdr,64px) + env(safe-area-inset-top,0px));z-index:15;background:var(--paper);
  margin:-10px -6px 0;padding:10px 6px 8px;border-bottom:1px solid var(--rule)}
.pbar-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pbar .ttl{min-width:0;flex:1;font-size:.82em;color:var(--ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .ttl b{font-family:var(--mono);color:var(--ink-strong)}
.pbar .cnt{font-family:var(--mono);font-weight:600;font-size:.92em;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.timer{font-family:var(--mono);font-weight:600;font-size:.92em;font-variant-numeric:tabular-nums;color:var(--ink-strong);
  border:1px solid var(--rule-2);border-radius:6px;padding:2px 8px;background:var(--surface)}
.timer.low{border-color:var(--ng);color:var(--ng);border-width:2px}
.sbtn{border:1px solid var(--rule-2);background:var(--surface);border-radius:7px;padding:5px 11px;font-size:.8em;
  font-family:var(--head);font-weight:700;color:var(--ink-strong);white-space:nowrap}
.sbtn:hover{border-color:var(--accent);color:var(--accent)}
.sbtn[aria-pressed="true"],.sbtn[aria-expanded="true"]{background:var(--accent-weak);border-color:var(--accent)}
.pbar .bar{margin-top:8px;height:4px}
.palette{margin-top:12px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px}
.palette .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--ink-mute);margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.pc{position:relative;height:38px;border:1px solid var(--rule-2);border-radius:6px;background:var(--surface);
  font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pc:hover{border-color:var(--accent)}
.pc.ans{background:var(--accent-weak);border-color:var(--accent);color:var(--ink-strong)}
.pc.ok{background:var(--ok-weak);border-color:var(--ok);color:var(--ok)}
.pc.ng{background:var(--ng-weak);border-color:var(--ng);color:var(--ng)}
.pc.ok::after,.pc.ng::after{position:absolute;right:3px;bottom:0;font-size:9px}
.pc.ok::after{content:"\2713"}
.pc.ng::after{content:"\2715"}
.pc.fl::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 10px 10px 0;
  border-color:transparent var(--mark-line) transparent transparent;border-top-right-radius:5px}
.pc[aria-current="true"]{outline:3px solid var(--ink-strong);outline-offset:1px}
.qcard section.q{margin-top:22px}
.qcard .q h2{border-bottom-width:1px}
.flagnote{font-size:.8em;color:var(--mark-line);font-weight:700}
.pnav{margin-top:26px;display:flex;gap:10px;align-items:center;max-width:740px}
.pnav .grow{flex:1}
@media(max-width:899px){
  body[data-view="play"] .pnav{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;max-width:none;
    background:var(--surface);border-top:1px solid var(--rule-2);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
  body[data-view="play"] .pnav .fbtn,body[data-view="play"] .pnav .pbtn{padding:10px 14px}
}
@media(max-width:520px){.pbar .timer ~ .cnt{margin-left:auto}.pbar-in .ttl.has-timer{display:none}}

/* ---- 結果と復習 ---- */
.score{margin-top:20px;display:grid;gap:10px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
.score .big{font-family:var(--head);font-weight:700;color:var(--ink-strong);font-size:clamp(28px,6vw,40px);line-height:1.2;
  font-variant-numeric:tabular-nums}
.score .big small{font-size:.45em;color:var(--ink-mute);margin-left:8px}
.score .verdict2{font-weight:700;font-size:.92em}
.score .verdict2.ok{color:var(--ok)}
.score .verdict2.ng{color:var(--ng)}
.scale{position:relative;height:12px;border-radius:6px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--rule)}
.scale>i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.scale>u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink-strong)}
.scale-l{position:relative;height:1.4em;font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
.scale-l span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.filters{margin-top:22px;display:flex;flex-wrap:wrap;gap:6px}
.stats{margin-top:20px;display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--surface);padding:14px 16px}
.stat .k{font-size:.78em;color:var(--ink-mute);font-weight:700}
.stat .v{font-family:var(--mono);font-weight:600;font-size:1.5em;color:var(--ink-strong);font-variant-numeric:tabular-nums;line-height:1.4}
.stat .v small{font-size:.55em;color:var(--ink-mute);margin-left:4px}
.tbl{margin-top:10px;width:100%;border-collapse:collapse;font-size:.88em;min-width:0}
.tbl td,.tbl th{padding:9px 8px;border-top:1px solid var(--rule);text-align:left;white-space:nowrap;font-weight:400;
  background:none;color:var(--ink);min-width:0}
.tbl th{font-size:.82em;color:var(--ink-mute);border-top:none;border-bottom:1px solid var(--rule-2)}
.tbl td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.tbl tr td:first-child{font-weight:400;color:var(--ink)}
.tblwrap{overflow-x:auto}
.domline{font-size:.82em;color:var(--ink-mute);margin:-4px 0 4px}
.domline b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.dgrp{margin-top:14px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px 6px}
.dhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.dhead .dn{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.dhead .dt{font-family:var(--head);font-weight:700;color:var(--ink-strong);flex:1;min-width:10em}
.dhead .dw{font-size:.78em;color:var(--ink-mute)}
.dhead .dr{font-family:var(--mono);font-weight:600;font-size:1.25em;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.dhead .dr small{font-size:.6em;color:var(--ink-mute);margin-left:2px}
.dbar{margin-top:8px;height:8px;overflow:visible}
.dbar>u{position:absolute;top:-4px;bottom:-4px;left:72%;width:2px;background:var(--ink-strong)}
.dsub{margin-top:6px;font-size:.8em;color:var(--ink-mute);font-variant-numeric:tabular-nums}
.trow{display:grid;grid-template-columns:2.4em minmax(0,1fr) 6em 7.5em 7em;gap:4px 12px;align-items:center;
  padding:9px 0;border-top:1px solid var(--rule);font-size:.88em}
.dgrp .trow:first-of-type{margin-top:10px}
.trow .tk{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:.92em}
.trow .tn{min-width:0;color:var(--ink-strong)}
.trow .tn em{font-style:normal;font-size:.82em;font-weight:700;color:var(--ng);margin-left:6px;white-space:nowrap}
.trow .tv{font-family:var(--mono);font-size:.86em;color:var(--ink-mute);font-variant-numeric:tabular-nums;text-align:right}
.trow .bar{height:5px}
.trow .sbtn{justify-self:end}
@media(max-width:600px){
  .dhead .dt{order:4;flex-basis:100%}
  .dhead .dw{margin-left:auto}
  .trow{grid-template-columns:2.4em minmax(0,1fr) auto}
  .trow .bar{grid-column:2 / 3;grid-row:2}
  .trow .tv{grid-column:3;grid-row:2}
  .trow .sbtn{grid-column:3;grid-row:1}
}
.dnote{font-size:.8em;color:var(--ink-mute);margin-top:8px;max-width:740px}
.dnote b{color:var(--ink-strong)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    <div class="brand" id="brand" role="button" tabindex="0"><span class="mk">SAA</span><span>判断ポイント</span></div>

    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="q" type="search" placeholder="サービス名・キーワードで検索" aria-label="検索">
    </label>
    <button class="iconbtn size-btn" id="size" aria-label="文字サイズを切り替える"><span class="ti" aria-hidden="true"><b style="font-family:var(--head);font-size:15px;line-height:1">A</b></span><span id="sizelabel">標準</span></button>
    <button class="iconbtn theme-btn" id="theme" aria-label="表示テーマを切り替える"><span class="ti" id="themeicon" aria-hidden="true"></span><span id="themelabel">自動</span></button>
    <button class="iconbtn menu-btn" id="menu" aria-expanded="false">目次</button>
  </div>
</header>

<div class="shell">
  <nav class="nav" id="nav" aria-label="章の一覧"></nav>
  <main id="main"></main>
</div>
<nav class="tabbar" aria-label="表示の切り替え" data-tabs="bottom"></nav>

<script src="content.js"></script>
<script src="exams.js"></script>
<script>
(function(){
  "use strict";
  var DATA = window.SAA_CONTENT || [];
  var main = document.getElementById('main'), nav = document.getElementById('nav'),
      q = document.getElementById('q'), menu = document.getElementById('menu');
  var root = document.documentElement, top = document.querySelector('.top');
  function isNarrow(){ return window.matchMedia('(max-width:899px)').matches; }
  function load(k, d){ try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  // ヘッダーの高さ（スマホは検索欄で2段になる）を、問題画面の固定バーの位置に使う
  function syncHeader(){ root.style.setProperty('--hdr', top.offsetHeight + 'px'); }

  /* ---- theme: 自動 / ライト / ダーク ---- */
  var hostTheme = root.getAttribute('data-theme');
  var themeBtn = document.getElementById('theme'),
      themeLabel = document.getElementById('themelabel'),
      themeIcon = document.getElementById('themeicon');
  var ICONS = {
    auto: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v18" ></path><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"></path></svg>',
    light: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg>',
    dark: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor" stroke="none"></path></svg>'
  };
  var LABELS = { auto: '自動', light: 'ライト', dark: 'ダーク' };
  var theme = 'auto';
  try { theme = localStorage.getItem('saa.theme') || 'auto'; } catch(e){}
  if(!LABELS[theme]) theme = 'auto';
  var applying = false;
  function applyTheme(){
    applying = true;
    if(theme === 'auto'){
      if(hostTheme) root.setAttribute('data-theme', hostTheme); else root.removeAttribute('data-theme');
    } else {
      root.setAttribute('data-theme', theme);
    }
    applying = false;
    themeIcon.innerHTML = ICONS[theme];
    themeLabel.textContent = LABELS[theme];
    themeBtn.setAttribute('title', '表示テーマ：' + LABELS[theme] + '（クリックで切り替え）');
  }
  themeBtn.addEventListener('click', function(){
    theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto';
    try { localStorage.setItem('saa.theme', theme); } catch(e){}
    applyTheme();
  });
  if(window.MutationObserver){
    new MutationObserver(function(){
      if(applying) return;
      hostTheme = theme === 'auto' ? root.getAttribute('data-theme') : hostTheme;
      if(theme !== 'auto' && root.getAttribute('data-theme') !== theme) applyTheme();
    }).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  }
  applyTheme();

  /* ---- 文字サイズ: 標準 / 大 / 特大 ---- */
  var SIZES = [['標準','17px'],['大','19px'],['特大','21px']];
  var sizeBtn = document.getElementById('size'), sizeLabel = document.getElementById('sizelabel');
  var sizeIdx = 0;
  try { sizeIdx = parseInt(localStorage.getItem('saa.fs'), 10); } catch(e){}
  if(!(sizeIdx >= 0 && sizeIdx < SIZES.length)) sizeIdx = 0;
  function applySize(){
    root.style.setProperty('--fs', SIZES[sizeIdx][1]);
    sizeLabel.textContent = SIZES[sizeIdx][0];
    sizeBtn.setAttribute('title', '文字サイズ：' + SIZES[sizeIdx][0] + '（クリックで切り替え）');
  }
  sizeBtn.addEventListener('click', function(){
    sizeIdx = (sizeIdx + 1) % SIZES.length;
    try { localStorage.setItem('saa.fs', String(sizeIdx)); } catch(e){}
    applySize(); syncHeader();
  });
  applySize();

  /* ---- 問題集のデータと記録 ---- */
  var EXAMS = window.SAA_EXAMS || [];
  var examById = {};
  EXAMS.forEach(function(s){
    examById[s.id] = s;
    s.no = parseInt((s.num.match(/\d+/) || ['0'])[0], 10);
    s.qmap = {};
    s.questions.forEach(function(qq, i){ s.qmap[qq.n] = qq; qq.idx = i; });
  });
  // 練習の解答（記号の並べ替えを行ったため、旧キーの解答は引き継がない）
  var answers = load('saa.exam.v2', {});
  var flags = load('saa.flags', {});        // 見直しの印 {setId:{n:1}}
  var pos = load('saa.pos', {});            // 練習の続きの位置 {setId:index}
  var mocks = load('saa.mock', {});         // 本番モードの途中経過 {setId:{start,limit,ans}}
  var attempts = load('saa.attempts', []);  // 本番モードの記録
  function saveAnswers(){ save('saa.exam.v2', answers); }

  // 系統（exams/README.md「セットの系統」と同じ分け方）
  var SERIES = [
    { name: '分野別', note: '公式ガイドの4分野を1つずつ', sets: [1, 2, 3, 4] },
    { name: '頻出テーマ', note: '取り違えやすい対比を集中的に', sets: [7, 8, 9, 10, 11, 12] },
    { name: '総合・複合', note: '分野を見極める／複数の要件を同時に満たす', sets: [5, 6, 17, 22] },
    { name: '分野別 2周目', note: '同じ分野を別の角度から', sets: [13, 14, 15, 16] },
    { name: '頻出テーマ 2周目', note: '1周目の対比を条件を変えて', sets: [23, 24, 25, 26, 27, 28] },

  ];
  (function(){
    var seen = {};
    SERIES.forEach(function(g){ g.list = g.sets.map(function(n){ seen[n] = 1; return EXAMS.filter(function(s){ return s.no === n; })[0]; }).filter(Boolean); });
    var rest = EXAMS.filter(function(s){ return !seen[s.no]; });

  })();
  var ORDERED = [];

  function isRight(qq, chosen){
    if(!chosen) return false;
    var p = chosen.split(',');
    return p.length === qq.answer.length && qq.answer.every(function(x){ return p.indexOf(x) >= 0; });
  }
  function examScore(set){
    var st = answers[set.id] || {}, done = 0, ok = 0;
    set.questions.forEach(function(qq){
      if(!st[qq.n]) return;
      done++;
      if(isRight(qq, st[qq.n])) ok++;
    });
    return { done: done, ok: ok, total: set.questions.length };
  }
  function minutesFor(set){ return set.questions.length * 2; }
  function fmtTime(sec){
    sec = Math.max(0, Math.round(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmtDate(t){
    var d = new Date(t);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }
  function pct(a, b){ return b ? Math.round(a * 100 / b) : 0; }

  var read = load('saa.read', {});

  function parts(ch){
    var m = ch.title.match(/^(.*)（出題比率\s*([0-9]+%)）\s*$/);
    return m ? { t: m[1], r: m[2] } : { t: ch.title, r: '' };
  }
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'; }); }
  function noLinks(h){ return String(h).replace(/<\/?a\b[^>]*>/g, ''); }
  function groups(){
    var order = [], by = {};
    DATA.forEach(function(ch){
      var g = ch.group || 'その他';
      if(!by[g]){ by[g] = []; order.push(g); }

  }
  function strip(h){ var d = document.createElement('div'); d.innerHTML = h; return d.textContent || ''; }
  function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function hl(html, terms){
    if(!terms.length) return html;
    var re = new RegExp('(' + terms.map(escRe).join('|') + ')', 'gi');
    return html.split(/(<[^>]+>)/).map(function(part){
      return part.charAt(0) === '<' ? part : part.replace(re, '<mark>$1</mark>');
    }).join('');
  }

  function renderBlock(b){
    if(b.t === 'lede') return '<div class="lede"><span class="tag">' + b.label + '</span><div>' + b.html + '</div></div>';
    if(b.t === 'note') return b.kind ? '<div class="note ' + b.kind + '"><span class="nl">' +
      (b.kind === 'warn' ? '注意' : '補足') + '</span>' + b.html + '</div>' : '<div class="dnote">' + b.html + '</div>';
    if(b.t === 'h3')   return '<h3>' + b.html + '</h3>';
    if(b.t === 'figure') return '<figure class="fig">' + b.svg +
      (b.caption ? '<figcaption>' + b.caption + '</figcaption>' : '') + '</figure>';
    if(b.t === 'p'){
      if(/^<b>[^<]*<\/b>$/.test(b.html)) return '<p class="label">' + esc(strip(b.html)) + '</p>';
      return '<p>' + b.html + '</p>';
    }
    if(b.t === 'ul' || b.t === 'ol'){
      return '<' + b.t + '>' + b.items.map(function(i){ return '<li>' + i + '</li>'; }).join('') + '</' + b.t + '>';
    }
    if(b.t === 'table'){
      if(b.head.length === 2){
        return '<div class="dl"><div class="cap"><span>' + esc(strip(b.head[0])) + '</span><span>' +
          esc(strip(b.head[1])) + '</span></div>' +
          b.rows.map(function(r){

      var labels = b.head.map(function(h){ return esc(strip(h)).replace(/"/g, '&quot;'); });
      return '<div class="tw"><table><thead><tr>' + b.head.map(function(h){ return '<th>' + h + '</th>'; }).join('') +
        '</tr></thead><tbody>' + b.rows.map(function(r){
          return '<tr>' + r.map(function(c, i){ return '<td data-l="' + (labels[i] || '') + '">' + c + '</td>'; }).join('') + '</tr>';

  /* ---- 検索の索引 ---- */
  var INDEX = [];

    INDEX.push({ c: ch.id, s: '', ct: chTitle, st: '章', h: chTitle, t: chTitle.toLowerCase(), k: 'head' });
    ch.sections.forEach(function(s){
      var where = { c: ch.id, s: s.id, ct: chTitle, st: (s.num ? s.num + ' ' : '') + s.title };
      INDEX.push({ c: ch.id, s: s.id, ct: chTitle, st: chTitle, h: where.st, t: strip(where.st).toLowerCase(), k: 'head' });
      var h3n = 0;
      s.blocks.forEach(function(b){
        if(b.t !== 'h3') return;
        var label = strip(b.html);
        INDEX.push({ c: ch.id, s: s.id + '-h' + (h3n++), ct: chTitle, st: where.st, h: b.html, t: label.toLowerCase(), k: 'head' });
      });
      function add(html, kind){
        var text = strip(html);
        if(text.length < 2) return;
        INDEX.push({ c: where.c, s: where.s, ct: where.ct, st: where.st, h: html, t: text.toLowerCase(), k: kind || '' });
      }
      s.blocks.forEach(function(b){
        if(b.t === 'table'){
          b.rows.forEach(function(r){
            if(b.head.length === 2) add((r[0] || '') + '<span class="ar">&rarr;</span><span class="ans">' + (r[1] || '') + '</span>', 'row');

          b.items.forEach(function(i){ add(i); });

  /* ---- 解く：系統ごとのセット一覧 ---- */
  function setStatus(set){

    var mine = attempts.map(function(a, i){ a.i = i; return a; }).filter(function(a){ return a.set === id; }).reverse();
    if(mine.length){
      h += '<div class="secthead">本番モードの記録</div><div class="tblwrap"><table class="tbl"><thead><tr><th>日時</th><th>正解</th><th>正答率</th><th>時間</th><th></th></tr></thead><tbody>' +
        mine.slice(0, 8).map(function(a){
          return '<tr><td>' + fmtDate(a.at) + '</td><td class="num">' + a.ok + '/' + a.total + '</td><td class="num">' + pct(a.ok, a.total) +
            '%</td><td class="num">' + fmtTime(a.sec) + (a.timeout ? '（時間切れ）' : '') + '</td><td><button class="lnk" data-result="' + a.i + '">結果を見る</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    h += '<div class="secthead">問題の一覧</div><div class="qlist">' + set.questions.map(function(qq, i){
      var c = st[qq.n];
      var res = !c ? '<span class="res na">未回答</span>' : isRight(qq, c) ? '<span class="res ok">✓ 正解</span>' : '<span class="res ng">✕ 不正解</span>';
      return '<button class="qrow" data-practice="' + id + '" data-i="' + i + '"><span class="qn">Q' + qq.n + '</span><span class="qt">' + qq.topic +
        (isFlag(id, qq.n) ? ' <span class="flagnote">◆ 見直し</span>' : '') + '</span><span class="lv">' + Array(qq.level + 1).join('★') + '</span>' + res + '</button>';
    }).join('') + '</div>';
    h += '<div class="btnrow"><button class="lnk" data-listview="' + id + '">解説を一覧で読む</button>' +
      (sc.done ? '<button class="lnk" data-askreset="' + id + '">このセットの練習の記録を消す</button>' : '') + '</div>';
    if(confirmReset === id){
      h += '<div class="confirm">練習モードの解答（' + sc.done + '問分）を消します。本番モードの記録と見直しの印は残ります。' +
        '<div class="btnrow"><button class="pbtn" data-doreset="' + id + '">消す</button><button class="fbtn" data-set="' + id + '">やめる</button></div></div>';
    }
    main.innerHTML = h;
    try { localStorage.setItem('saa.lastset', id); } catch(e){}
  }

  /* ---- 1問の描画（練習・本番・結果の確認で共通） ---- */
  // o: { chosen, reveal, picked, live }  live=false なら選択肢は押せない
  function renderQ(set, qq, o){
    var multi = qq.answer.length > 1;
    var picked = o.picked || (o.chosen ? o.chosen.split(',') : []);
    var h = '<section class="q" id="' + set.id + '-q' + qq.n + '"><h2><span class="n">Q' + qq.n +
      '</span><span>' + qq.topic + '</span><span class="lv">' + Array(qq.level + 1).join('★') + '</span></h2>' +
      '<div class="qbody">' + qq.body.map(function(b){ return '<p>' + b + '</p>'; }).join('') + '</div>' +
      '<div class="opts" role="group" aria-label="Q' + qq.n + ' の選択肢">';
    qq.options.forEach(function(op){
      var isAns = qq.answer.indexOf(op.l) >= 0, isPicked = picked.indexOf(op.l) >= 0;
      var cls = 'opt', mk = '', attr = '';
      if(o.reveal){
        attr = ' aria-disabled="true"';
        if(isAns){ cls += ' correct'; mk = isPicked ? '✓ 正解' : '✓ 正解（未選択）'; }
        else if(isPicked){ cls += ' wrong'; mk = '✕ 選択'; }
      } else {
        if(isPicked){ cls += ' picked'; mk = multi ? '☑ 選択中' : '◉ 選択中'; }
        attr = ' aria-pressed="' + (isPicked ? 'true' : 'false') + '"';
        if(!o.live) attr += ' aria-disabled="true"';
      }
      h += '<button class="' + cls + '" data-opt="' + op.l + '"' + attr + '><b class="ol">' + op.l + '</b><span>' + op.html + '</span>' +
        (mk ? '<span class="mk">' + mk + '</span>' : '') + '</button>';
    });
    h += '</div>';
    if(o.submit){
      var need = qq.answer.length;
      h += '<div class="submitrow"><button class="fbtn" data-act="submit"' + (picked.length === need ? '' : ' disabled') +
        '>解答する</button><span class="hint">' + need + 'つ選んでください（選択中 ' + picked.length + '）</span></div>';
    } else if(o.hint){
      h += '<div class="submitrow"><span class="hint">' + o.hint + '</span></div>';
    }
    if(o.reveal){
      var right = isRight(qq, o.chosen), ansText = qq.answer.join('・');
      h += '<div class="expl"><div class="verdict ' + (right ? 'ok' : 'ng') + '">' +
        (right ? '✓ 正解（' + ansText + '）' : !o.chosen ? '✕ 未回答 — 正解は ' + ansText : '✕ 不正解 — 正解は ' + ansText) + '</div>' +
        (qq.dom && qq.dom.length ? '<div class="domline">分野　' + qq.dom.map(function(t){ return '<b>' + t + '</b> ' + (TASKS[t] || ''); }).join('／') + '</div>' : '') +
        (qq.req ? '<div class="lbl">要件の分解</div><div class="req">' + qq.req + '</div>' : '') +
        '<div class="lbl">決め手</div><div>' + qq.key + '</div>' +
        (qq.kw ? '<div class="lbl">キーワード</div><div class="kw">' + qq.kw + '</div>' : '') +
        (qq.figs || []).filter(function(fg){ return FIGS[fg.id]; }).map(function(fg){
          return '<figure class="fig qfig">' + FIGS[fg.id] + '<figcaption>図：' + esc(fg.alt) + '</figcaption></figure>';
        }).join('') +
        '<div class="lbl">他の選択肢を外す理由</div><ul>' +
        qq.reasons.map(function(r){ return '<li><b>' + r.l + '</b>：' + r.html + '</li>'; }).join('') +
        '</ul><div class="refs">参照：' + qq.refs + '</div></div>';
    }
    return h + '</section>';
  }

  /* ---- 1問ずつ解く画面 ---- */
  // P.kind: practice（セットの練習）／retry（間違い・印の解き直し）／mock（本番）／result（本番の結果の確認）
  var P = null, timerId = null;
  function itemAt(i){ var it = P.list[i]; return { set: examById[it.s], q: examById[it.s].qmap[it.n], key: it.s + ':' + it.n, it: it }; }
  function chosenOf(i){
    var x = itemAt(i), it = x.it;
    if(P.kind === 'practice') return (answers[it.s] || {})[it.n];
    if(P.kind === 'retry') return P.local[x.key];
    if(P.kind === 'mock') return mocks[P.setId].ans[it.n];
    if(P.kind === 'result') return attempts[P.attempt].ans[it.n];
  }
  function cellClass(i){
    var x = itemAt(i), c = chosenOf(i), cls = 'pc';
    if(P.kind === 'mock'){ if(c) cls += ' ans'; }
    else if(P.kind === 'result'){ cls += isRight(x.q, c) ? ' ok' : ' ng'; }
    else if(c){ cls += isRight(x.q, c) ? ' ok' : ' ng'; }
    if(isFlag(x.it.s, x.it.n)) cls += ' fl';
    return cls;
  }
  function openPlayer(p){
    P = p; P.pend = {}; P.palette = false; P.confirm = false;
    setView('play', P.kind === 'retry' ? 'review' : P.kind === 'result' ? (P.from === 'review' ? 'review' : 'solve') : 'solve');
    renderPlayer(true);
    if(P.kind === 'mock') startTimer();
  }
  function practice(id, i){
    var set = examById[id];
    if(!set) return solveHub();
    if(i == null){
      i = pos[id] || 0;
      var st = answers[id] || {};
      if(st[set.questions[i] && set.questions[i].n]){
        // 続きは最初の未回答の問題から
        for(var k = 0; k < set.questions.length; k++){ if(!st[set.questions[k].n]){ i = k; break; } }
      }
    }
    try { localStorage.setItem('saa.lastset', id); } catch(e){}
    openPlayer({ kind: 'practice', setId: id, i: Math.max(0, Math.min(i, set.questions.length - 1)),
      list: set.questions.map(function(qq){ return { s: id, n: qq.n }; }) });
  }
  function startMock(id){
    var set = examById[id];
    if(!set) return solveHub();
    if(!mocks[id]){
      mocks[id] = { start: Date.now(), limit: minutesFor(set) * 60, ans: {}, i: 0 };
      save('saa.mock', mocks);
    }
    if(mocks[id].limit - (Date.now() - mocks[id].start) / 1000 <= 0) return finishMock(id, true);
    openPlayer({ kind: 'mock', setId: id, i: mocks[id].i || 0,
      list: set.questions.map(function(qq){ return { s: id, n: qq.n }; }) });
  }
  function startRetry(list, title){
    if(!list.length) return reviewHub();
    openPlayer({ kind: 'retry', i: 0, list: list, local: {}, title: title });
  }
  function showAttemptQ(ai, i, from){
    var a = attempts[ai];
    if(!a || !examById[a.set]) return reviewHub();
    openPlayer({ kind: 'result', attempt: ai, setId: a.set, i: i || 0, from: from,
      list: examById[a.set].questions.map(function(qq){ return { s: a.set, n: qq.n }; }) });
  }

  function renderPlayer(scrollTop){
    var x = itemAt(P.i), n = P.list.length, c = chosenOf(P.i);
    var answeredCount = 0;
    for(var k = 0; k < n; k++) if(chosenOf(k)) answeredCount++;
    var title = P.kind === 'retry' ? P.title : x.set.num + ' ' + x.set.title;
    var label = P.kind === 'mock' ? '本番モード' : P.kind === 'result' ? '結果の確認' : P.kind === 'retry' ? '解き直し' : '練習モード';
    var flagged = isFlag(x.it.s, x.it.n);
    var h = '<div class="pbar"><div class="pbar-in">' +
      '<button class="sbtn" data-act="close" aria-label="問題画面を閉じる">✕ 閉じる</button>' +
      '<span class="ttl' + (P.kind === 'mock' ? ' has-timer' : '') + '"><b>' + label + '</b>　' + esc(strip(title)) + '</span>' +
      (P.kind === 'mock' ? '<span class="timer" id="timer"></span>' : '') +
      '<span class="cnt">' + (P.i + 1) + ' / ' + n + '</span>' +
      '<button class="sbtn" data-act="palette" aria-expanded="' + (P.palette ? 'true' : 'false') + '">一覧</button></div>' +
      '<div class="bar"><i style="width:' + pct(answeredCount, n) + '%"></i></div></div>';
    if(P.palette){
      h += '<div class="palette"><div class="legend">' +
        (P.kind === 'mock' ? '<span>青＝回答済み</span><span>白＝未回答</span>' : '<span>✓ 正解</span><span>✕ 不正解</span><span>白＝未回答</span>') +
        '<span>右上の印＝見直し</span><span>回答 ' + answeredCount + ' / ' + n + '</span></div><div class="pgrid">';
      for(var j = 0; j < n; j++){
        var lab = P.kind === 'retry' ? (j + 1) : itemAt(j).q.n;
        h += '<button class="' + cellClass(j) + '" data-goto="' + j + '"' + (j === P.i ? ' aria-current="true"' : '') + '>' + lab + '</button>';
      }
      h += '</div>' + (P.kind === 'mock' ? '<div class="btnrow"><button class="pbtn" data-act="finish">提出して採点する</button></div>' : '') + '</div>';
    }
    if(P.kind === 'retry') h += '<div class="meta"><span>' + x.set.num + '</span><span>' + x.set.title + '</span></div>';
    var reveal = P.kind === 'result' || ((P.kind === 'practice' || P.kind === 'retry') && !!c);
    var opts = { chosen: c, reveal: reveal, live: !reveal };
    if(!reveal && x.q.multi){
      if(P.kind === 'mock') opts.hint = x.q.answer.length + 'つ選んでください（選択中 ' + (c ? c.split(',').length : 0) + '）';
      else { opts.picked = P.pend[x.key] || []; opts.submit = true; }
    } else if(!reveal && P.kind === 'mock'){
      opts.hint = '答えは提出するまで変えられます。';
    }
    h += '<div class="qcard">' + renderQ(x.set, x.q, opts) + '</div>';
    var last = P.i === n - 1;
    h += '<div class="pnav"><button class="fbtn" data-act="prev"' + (P.i ? '' : ' disabled') + '>&lsaquo; 前へ</button>' +
      '<button class="sbtn" data-act="flag" aria-pressed="' + (flagged ? 'true' : 'false') + '">' + (flagged ? '◆ 見直しの印' : '◇ 見直しに印') + '</button>' +
      '<span class="grow"></span>';
    if(P.kind === 'mock' && last) h += '<button class="pbtn" data-act="finish">提出する</button>';
    else if(last) h += '<button class="pbtn" data-act="done">' + (P.kind === 'retry' ? '解き直しを終える' : P.kind === 'result' ? '結果へ戻る' : 'セットの扉へ') + '</button>';
    else h += '<button class="pbtn" data-act="next">次へ &rsaquo;</button>';
    h += '</div>';
    if(P.confirm){
      var un = 0;
      for(var u = 0; u < n; u++) if(!chosenOf(u)) un++;
      h += '<div class="confirm">' + (un ? '未回答が <b>' + un + '</b> 問あります。' : 'すべての問題に回答しました。') +
        '提出すると採点し、答えは変えられなくなります。<div class="btnrow"><button class="pbtn" data-act="finish-yes">提出する</button>' +
        '<button class="fbtn" data-act="finish-no">戻って見直す</button></div></div>';
    }
    main.innerHTML = h;
    if(P.kind === 'mock') tick();
    if(scrollTop) window.scrollTo(0, 0);
    if(P.kind === 'practice'){ pos[P.setId] = P.i; save('saa.pos', pos); }
    if(P.kind === 'mock'){ mocks[P.setId].i = P.i; save('saa.mock', mocks); }
  }

  function tick(){
    if(!P || P.kind !== 'mock') return;
    var m = mocks[P.setId]; if(!m) return;
    var left = m.limit - (Date.now() - m.start) / 1000;
    var el = document.getElementById('timer');
    if(el){
      el.textContent = '残り ' + fmtTime(left);
      el.className = 'timer' + (left < 300 ? ' low' : '');
    }
    if(left <= 0){ stopTimer(); finishMock(P.setId, true); }
  }
  function startTimer(){ stopTimer(); timerId = setInterval(tick, 1000); }
  function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

  function finishMock(id, timeout){
    var set = examById[id], m = mocks[id];
    if(!set || !m) return solveHub();
    var ok = 0;
    if(!answers[id]) answers[id] = {};
    set.questions.forEach(function(qq){
      var c = m.ans[qq.n];
      if(isRight(qq, c)) ok++;
      if(c) answers[id][qq.n] = c;   // 練習の記録にも反映（未回答の問題は以前の記録を残す）
    });
    var sec = Math.min(m.limit, (Date.now() - m.start) / 1000);
    attempts.push({ set: id, at: Date.now(), sec: sec, limit: m.limit, ans: m.ans, ok: ok, total: set.questions.length, timeout: !!timeout });
    if(attempts.length > 40) attempts = attempts.slice(-40);
    delete mocks[id];
    save('saa.attempts', attempts); save('saa.mock', mocks); saveAnswers();
    stopTimer();
    result(attempts.length - 1, 'all');
  }

  /* ---- 本番モードの結果 ---- */
  function result(ai, filter, from){
    var a = attempts[ai];
    if(!a || !examById[a.set]) return reviewHub();
    setView('solve', from === 'review' ? 'review' : 'solve');
    var set = examById[a.set], p = pct(a.ok, a.total), need = Math.ceil(a.total * 0.72);
    var un = set.questions.filter(function(qq){ return !a.ans[qq.n]; }).length;
    var h = '<button class="lnk" data-set="' + set.id + '">&lsaquo; ' + set.num + 'の扉</button>' +
      '<div class="eyebrow" style="margin-top:10px">本番モードの結果 · ' + fmtDate(a.at) + '</div><h1>' + set.title + '</h1>' +
      '<div class="score"><div class="big">' + a.ok + ' / ' + a.total + '<small>正答率 ' + p + '%</small></div>' +
      '<div class="scale" aria-hidden="true"><i style="width:' + p + '%"></i><u style="left:72%"></u></div>' +
      '<div class="scale-l" aria-hidden="true"><span style="left:0;transform:none">0%</span><span style="left:72%">目安 72%</span><span style="left:100%;transform:translateX(-100%)">100%</span></div>' +
      '<div class="verdict2 ' + (a.ok >= need ? 'ok' : 'ng') + '">' + (a.ok >= need ? '✓ 目安（72%）に届いています' : '✕ 目安（72%＝' + need + '問）まであと ' + (need - a.ok) + ' 問') + '</div>' +
      '<div class="meta" style="margin-top:0"><span>時間 <b>' + fmtTime(a.sec) + '</b> / ' + fmtTime(a.limit) + (a.timeout ? '（時間切れで提出）' : '') + '</span>' +
      '<span>未回答 <b>' + un + '</b> 問</span></div></div>';
    var byD = {};
    DOMAINS.forEach(function(x){ byD[x.d] = blank(); });
    set.questions.forEach(function(qq){
      var b = byD[((qq.dom || [])[0] || '0')[0]];
      if(!b) return;
      b.total++; if(isRight(qq, a.ans[qq.n])) b.ok++;
    });
    var drows = DOMAINS.filter(function(x){ return byD[x.d].total; });
    if(drows.length > 1){
      h += '<div class="secthead">分野別の結果</div><div class="tblwrap"><table class="tbl"><thead><tr><th>分野</th><th>正解</th><th>正答率</th><th></th></tr></thead><tbody>' +
        drows.map(function(x){
          var b = byD[x.d], r = b.ok / b.total;
          return '<tr><td>第' + x.d + '分野 ' + x.name + '</td><td class="num">' + b.ok + '/' + b.total + '</td><td class="num">' + pct(b.ok, b.total) +
            '%</td><td>' + (r >= 0.72 ? '<span class="chip done">✓ 目安以上</span>' : '<span class="chip">▲ 要復習</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div><div class="dnote">各問の主な分野で集計しています。</div>';
    }
    var wrong = set.questions.filter(function(qq){ return !isRight(qq, a.ans[qq.n]); });
    h += '<div class="btnrow">' + (wrong.length ? '<button class="pbtn" data-retryattempt="' + ai + '">間違えた ' + wrong.length + ' 問を解き直す</button>' : '') +
      '<button class="fbtn" data-mock="' + set.id + '">もう一度本番モード</button></div>';
    h += '<div class="filters">' + [['all', 'すべて'], ['ng', '不正解・未回答'], ['fl', '見直しの印']].map(function(f){
      return '<button class="sbtn" data-filter="' + ai + ':' + f[0] + '" aria-pressed="' + (filter === f[0] ? 'true' : 'false') + '">' + f[1] + '</button>';
    }).join('') + '</div><div class="qlist">';
    set.questions.forEach(function(qq, i){
      var c = a.ans[qq.n], r = isRight(qq, c), fl = isFlag(set.id, qq.n);
      if(filter === 'ng' && r) return;
      if(filter === 'fl' && !fl) return;
      h += '<button class="qrow" data-attemptq="' + ai + ':' + i + '"><span class="qn">Q' + qq.n + '</span><span class="qt">' + qq.topic +
        (fl ? ' <span class="flagnote">◆ 見直し</span>' : '') + '</span><span class="lv">' + Array(qq.level + 1).join('★') + '</span>' +
        (r ? '<span class="res ok">✓ 正解</span>' : c ? '<span class="res ng">✕ 不正解</span>' : '<span class="res na">✕ 未回答</span>') + '</button>';
    });
    h += '</div>';
    main.innerHTML = h;
    window.scrollTo(0, 0);
    P = { kind: 'result-list', attempt: ai, from: from };
  }

  /* ---- 解説の一覧（読み物として） ---- */
  function listView(id){
    var set = examById[id];
    if(!set) return solveHub();
    setView('solve', 'solve');
    var st = answers[id] || {};
    var h = '<button class="lnk" data-set="' + id + '">&lsaquo; ' + set.num + 'の扉</button>' +
      '<div class="eyebrow" style="margin-top:10px">' + set.num + ' · 解説の一覧</div><h1>' + set.title + '</h1>' +
      '<div class="lead">全問の正解と解説を続けて表示しています。解くときは<b>練習モード</b>か<b>本番モード</b>を使ってください。</div>';
    set.questions.forEach(function(qq){ h += renderQ(set, qq, { chosen: st[qq.n], reveal: true }); });
    main.innerHTML = h;
    window.scrollTo(0, 0);
  }

  /* ---- 復習 ---- */
  /* ---- 分野（公式試験ガイドの4分野・14タスク） ---- */
  var TASKS = window.SAA_TASKS || {};
  var FIGS = window.SAA_FIGS || {};
  var DOMAINS = [
    { d: '1', name: 'セキュアなアーキテクチャ', w: 30 },
    { d: '2', name: '弾力性に優れたアーキテクチャ', w: 26 },
    { d: '3', name: '高パフォーマンスなアーキテクチャ', w: 24 },
    { d: '4', name: 'コストを最適化したアーキテクチャ', w: 20 }
  ];
  function domLabel(t){ return t + ' ' + (TASKS[t] || ''); }
  function blank(){ return { total: 0, done: 0, ok: 0 }; }
  // 練習の記録（本番モードの解答も反映済み）から、分野・タスクごとに数える。
  // 複数の分野をまたぐ問題は、それぞれの分野・タスクに数える。
  function domainStats(){
    var st = { d: {}, t: {} };
    DOMAINS.forEach(function(x){ st.d[x.d] = blank(); });
    Object.keys(TASKS).forEach(function(t){ st.t[t] = blank(); });
    EXAMS.forEach(function(s){
      var rec = answers[s.id] || {};
      s.questions.forEach(function(qq){
        var c = rec[qq.n], r = c && isRight(qq, c), seen = {};
        (qq.dom || []).forEach(function(t){
          var b = [st.t[t] || (st.t[t] = blank())];
          if(!seen[t[0]]){ seen[t[0]] = 1; b.push(st.d[t[0]]); }
          b.forEach(function(x){ x.total++; if(c){ x.done++; if(r) x.ok++; } });
        });
      });
    });
    return st;
  }
  // そのタスクの問題を、間違い → 未回答 の順に最大20問。どちらもなければ全問から
  function taskItems(t){
    var wrong = [], fresh = [], all = [];
    ORDERED.forEach(function(s){
      var rec = answers[s.id] || {};
      s.questions.forEach(function(qq){
        if((qq.dom || []).indexOf(t) < 0) return;
        var it = { s: s.id, n: qq.n }, c = rec[qq.n];
        all.push(it);
        if(!c) fresh.push(it); else if(!isRight(qq, c)) wrong.push(it);
      });
    });
    var list = wrong.concat(fresh);
    return { list: (list.length ? list : all).slice(0, 20), wrong: wrong.length, fresh: fresh.length, again: !list.length };
  }
  function domainSection(){
    var st = domainStats(), h = '', est = 0, estOk = true;
    DOMAINS.forEach(function(x){
      var b = st.d[x.d];
      if(b.done < 5) estOk = false; else est += x.w * b.ok / b.done;
      h += '<div class="dgrp"><div class="dhead"><span class="dn">第' + x.d + '分野</span><span class="dt">' + x.name +
        '</span><span class="dw">配点 ' + x.w + '%</span><span class="dr">' + (b.done ? pct(b.ok, b.done) + '<small>%</small>' : '–') + '</span></div>' +
        '<div class="bar dbar" aria-hidden="true"><i style="width:' + pct(b.ok, b.done) + '%"></i><u></u></div>' +
        '<div class="dsub">回答 ' + b.done + ' / ' + b.total + ' 問・正解 ' + b.ok + ' 問</div>';
      Object.keys(TASKS).filter(function(t){ return t[0] === x.d; }).forEach(function(t){
        var tb = st.t[t], ti = taskItems(t), weakT = tb.done >= 5 && tb.ok / tb.done < 0.72;
        h += '<div class="trow"><span class="tk">' + t + '</span><span class="tn">' + TASKS[t] + (weakT ? '<em>▲ 目安未満</em>' : '') + '</span>' +
          '<span class="bar" aria-hidden="true"><i style="width:' + pct(tb.ok, tb.done) + '%"></i></span>' +
          '<span class="tv">' + (tb.done ? tb.ok + '/' + tb.done + '　' + pct(tb.ok, tb.done) + '%' : '0/' + tb.total + ' 問') + '</span>' +
          '<button class="sbtn" data-dtask="' + t + '" title="' + (ti.again ? 'すべて正解済み。もう一度解く' : '間違い ' + ti.wrong + '問・未回答 ' + ti.fresh + '問') + '">' +
          (ti.again ? 'もう一度' : ti.wrong ? '間違い ' + ti.wrong : '未回答から') + '</button></div>';
      });
      h += '</div>';
    });
    var head = '<div class="secthead">分野別の正答率</div>' +
      '<div class="dnote">公式試験ガイドの4分野・14タスクで集計しています。縦線は合格の目安（72%）。分野をまたぐ問題はそれぞれの分野に数えます。' +
      'ボタンを押すと、そのタスクの問題を<b>間違い → 未回答</b>の順に最大20問解けます。</div>';
    if(estOk) head += '<div class="dnote">配点で重み付けした正答率：<b>' + Math.round(est) + '%</b>（各分野5問以上の回答から推定）</div>';
    return head + h;
  }

  function wrongItems(){
    var out = [];
    ORDERED.forEach(function(s){
      var st = answers[s.id] || {};
      s.questions.forEach(function(qq){ if(st[qq.n] && !isRight(qq, st[qq.n])) out.push({ s: s.id, n: qq.n }); });
    });
    return out;
  }
  function flagItems(){
    var out = [];
    ORDERED.forEach(function(s){ s.questions.forEach(function(qq){ if(isFlag(s.id, qq.n)) out.push({ s: s.id, n: qq.n }); }); });
    return out;
  }
  function reviewHub(){
    setView('review', 'review');
    var total = 0, done = 0, ok = 0;
    EXAMS.forEach(function(s){ var sc = examScore(s); total += sc.total; done += sc.done; ok += sc.ok; });
    var wr = wrongItems(), fl = flagItems();
    var h = '<div class="eyebrow">復習</div><h1>間違えた問題と弱点</h1>';
    if(!done && !attempts.length && !fl.length){
      h += '<div class="empty-state">まだ記録がありません。<b>解く</b>から問題を解くと、間違えた問題・見直しの印・本番モードの結果・分野別の正答率がここに集まります。' +
        '下の分野別の一覧から、タスクを選んで解き始めることもできます。' +
        '<div class="btnrow"><button class="pbtn" data-go="solve">問題を解く</button></div></div>';
      main.innerHTML = h + domainSection(); return;
    }
    h += '<div class="stats">' +
      '<div class="stat"><div class="k">回答済み</div><div class="v">' + done + '<small>/ ' + total + '</small></div></div>' +
      '<div class="stat"><div class="k">正答率</div><div class="v">' + (done ? pct(ok, done) : '–') + '<small>%</small></div></div>' +
      '<div class="stat"><div class="k">間違えた問題</div><div class="v">' + wr.length + '<small>問</small></div></div>' +
      '<div class="stat"><div class="k">見直しの印</div><div class="v">' + fl.length + '<small>問</small></div></div></div>';
    h += '<div class="btnrow"><button class="pbtn" data-retry="wrong"' + (wr.length ? '' : ' disabled') + '>間違えた ' + wr.length + ' 問を解き直す</button>' +
      '<button class="fbtn" data-retry="flag"' + (fl.length ? '' : ' disabled') + '>印を付けた ' + fl.length + ' 問を解く</button></div>' +
      '<div class="meta">解き直して正解すると、間違えた問題の一覧から外れます。</div>';
    h += domainSection();
    var weak = EXAMS.map(function(s){ var sc = examScore(s); return { s: s, sc: sc }; })
      .filter(function(x){ return x.sc.done >= 5; })
      .sort(function(a, b){ return a.sc.ok / a.sc.done - b.sc.ok / b.sc.done; }).slice(0, 5);
    if(weak.length){
      h += '<div class="secthead">正答率の低いセット（5問以上回答）</div>';
      weak.forEach(function(x){
        h += '<button class="setrow" data-set="' + x.s.id + '"><span class="no">セット' + (x.s.no < 10 ? '0' : '') + x.s.no + '</span>' +
          '<span class="tt">' + x.s.title.replace(/（.*?）$/, '') + '</span><span class="pr"><span class="bar"><i class="ok" style="width:' + pct(x.sc.ok, x.sc.done) + '%"></i></span>' +
          '<span>正答 ' + x.sc.ok + '/' + x.sc.done + '（' + pct(x.sc.ok, x.sc.done) + '%）</span></span><span class="st"><span class="chip">' + (x.sc.done - x.sc.ok) + '問ミス</span></span></button>';
      });
    }
    if(attempts.length){
      h += '<div class="secthead">本番モードの記録</div><div class="tblwrap"><table class="tbl"><thead><tr><th>日時</th><th>セット</th><th>正解</th><th>正答率</th><th></th></tr></thead><tbody>' +
        attempts.map(function(a, i){ a.i = i; return a; }).slice().reverse().slice(0, 12).map(function(a){
          var s = examById[a.set];
          return '<tr><td>' + fmtDate(a.at) + '</td><td>' + (s ? s.num.replace('問題', '') : a.set) + '</td><td class="num">' + a.ok + '/' + a.total +
            '</td><td class="num">' + pct(a.ok, a.total) + '%</td><td><button class="lnk" data-result="' + a.i + ':review">結果</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    if(wr.length){
      h += '<div class="secthead">間違えた問題</div><div class="qlist">';
      wr.forEach(function(it){
        var s = examById[it.s], qq = s.qmap[it.n];
        h += '<button class="qrow" data-practice="' + it.s + '" data-i="' + qq.idx + '"><span class="qn">' + s.num.replace('問題セット', 'S') + '</span>' +
          '<span class="qt">Q' + qq.n + ' ' + qq.topic + '</span><span class="lv">' + Array(qq.level + 1).join('★') + '</span><span class="res ng">✕</span></button>';
      });
      h += '</div>';
    }
    main.innerHTML = h;
  }

  /* ---- 検索 ---- */
  function norm(t){
    return (t.normalize ? t.normalize('NFKC') : t).toLowerCase()
      .replace(/[\s()\[\]「」『』【】〈〉《》・,、。.:：;；\/｜|'"“”‘’-]/g, '');
  }
  function results(query){
    setView('search');
    var terms = query.trim().split(/[\s　]+/).filter(Boolean);
    var keys = terms.map(norm).filter(Boolean);
    var hits = INDEX.filter(function(e){
      if(e.n === undefined) e.n = norm(e.t);
      return keys.length && keys.every(function(x){ return e.n.indexOf(x) >= 0; });
    });
    var heads = hits.filter(function(e){ return e.k === 'head'; });
    hits = hits.filter(function(e){ return e.k !== 'head'; });
    hits.sort(function(a, b){ return (b.k === 'row' ? 1 : 0) - (a.k === 'row' ? 1 : 0); });
    var h = '<div class="eyebrow">検索</div><h1>' + esc(query) + '</h1>' +
      '<div class="rescount">' + (heads.length + hits.length) + ' 件</div>';
    if(heads.length){
      h += '<div class="resgrp heads"><h3>章・節の見出し</h3>' + heads.map(function(e){
        return '<button class="hit head" data-go="' + e.c + '"' + (e.s ? ' data-sec="' + e.s + '"' : '') +
          '><span class="where">' + e.st + '</span><span class="ht">' + hl(e.h, terms) + '</span></button>';
      }).join('') + '</div>';
    }
    if(!hits.length && !heads.length){
      h += '<div class="empty">該当なし。別の表記（略称・英語名・日本語）でも試してみてください。</div>';
    } else {
      var order = [], byCh = {};
      hits.slice(0, 160).forEach(function(e){
        if(!byCh[e.ct]){ byCh[e.ct] = []; order.push(e.ct); }
        byCh[e.ct].push(e);
      });
      order.forEach(function(ct){
        h += '<div class="resgrp"><h3>' + ct + '</h3>' + byCh[ct].map(function(e){
          return '<button class="hit" data-go="' + e.c + '" data-sec="' + e.s + '"><span class="where">' +
            e.st + '</span>' + hl(noLinks(e.h), terms) + '</button>';
        }).join('') + '</div>';
      });
    }
    main.innerHTML = h;
  }

  /* ---- 画面の切り替え ---- */
  function go(id, sec){
    if(q.value && !sec) q.value = '';
    if(id === 'home' || id === 'read'){
      var lr = null;
      if(id === 'read'){ try { lr = localStorage.getItem('saa.lastread'); } catch(e){} }
      if(lr && DATA.some(function(c){ return c.id === lr; })) chapter(lr); else home();
    }
    else if(id === 'solve') solveHub();
    else if(id === 'review') reviewHub();
    else if(examById[id]){
      if(sec && /^q\d+$/.test(sec)){
        var qq = examById[id].qmap[parseInt(sec.slice(1), 10)];
        practice(id, qq ? qq.idx : 0);
        return;
      }
      setPage(id);
    }
    else chapter(id);
    if(sec){
      var el = document.getElementById(id + '-' + sec);
      if(el){ el.scrollIntoView({ block: 'start' }); return; }
    }
    window.scrollTo(0, 0);
  }

  function playerAct(act, el){
    var x = itemAt(P.i), n = P.list.length;
    if(act === 'close'){
      if(P.kind === 'retry') return go('review');
      if(P.kind === 'result') return result(P.attempt, 'all', P.from);
      return go(P.setId);
    }
    if(act === 'palette'){ P.palette = !P.palette; return renderPlayer(false); }
    if(act === 'prev' && P.i > 0){ P.i--; P.confirm = false; return renderPlayer(true); }
    if(act === 'next' && P.i < n - 1){ P.i++; P.confirm = false; return renderPlayer(true); }
    if(act === 'flag'){
      var f = flags[x.it.s] || (flags[x.it.s] = {});
      if(f[x.it.n]) delete f[x.it.n]; else f[x.it.n] = 1;
      save('saa.flags', flags);
      return renderPlayer(false);
    }
    if(act === 'finish'){ P.confirm = true; P.palette = false; renderPlayer(false);
      var cf = main.querySelector('.confirm'); if(cf) cf.scrollIntoView({ block: 'center' }); return; }
    if(act === 'finish-no'){ P.confirm = false; return renderPlayer(false); }
    if(act === 'finish-yes') return finishMock(P.setId, false);
    if(act === 'done'){
      if(P.kind === 'retry') return go('review');
      if(P.kind === 'result') return result(P.attempt, 'all', P.from);
      return go(P.setId);
    }
    if(act === 'submit'){
      var chosen = (P.pend[x.key] || []).slice().sort();
      if(chosen.length !== x.q.answer.length) return;
      record(x, chosen.join(','));
      delete P.pend[x.key];
      return renderPlayer(false);
    }
  }
  function record(x, val){
    if(P.kind === 'retry') P.local[x.key] = val;
    if(!answers[x.it.s]) answers[x.it.s] = {};
    answers[x.it.s][x.it.n] = val;
    saveAnswers();
  }
  function pickOption(letter){
    var x = itemAt(P.i), c = chosenOf(P.i);
    if(P.kind === 'result') return;
    if(P.kind === 'mock'){
      var m = mocks[P.setId];
      if(x.q.multi){
        var cur = c ? c.split(',') : [], at = cur.indexOf(letter);
        if(at >= 0) cur.splice(at, 1); else cur.push(letter);
        if(cur.length) m.ans[x.it.n] = cur.sort().join(','); else delete m.ans[x.it.n];
      } else {
        m.ans[x.it.n] = letter;
      }
      save('saa.mock', mocks);
      return renderPlayer(false);
    }
    if(c) return;   // 練習・解き直しは1回目の解答で確定
    if(x.q.multi){
      var p = P.pend[x.key] || (P.pend[x.key] = []), k = p.indexOf(letter);
      if(k >= 0) p.splice(k, 1); else p.push(letter);
      return renderPlayer(false);
    }
    record(x, letter);
    renderPlayer(false);
  }

  document.addEventListener('click', function(e){
    if(!e.target.closest) return;
    var t;
    if((t = e.target.closest('[data-tab]'))){ return go(t.getAttribute('data-tab')); }
    if(document.body.getAttribute('data-view') === 'play' && P && P.list){
      if((t = e.target.closest('[data-opt]'))){
        if(t.getAttribute('aria-disabled') === 'true') return;
        return pickOption(t.getAttribute('data-opt'));
      }
      if((t = e.target.closest('[data-goto]'))){ P.i = +t.getAttribute('data-goto'); P.palette = false; P.confirm = false; return renderPlayer(true); }
      if((t = e.target.closest('[data-act]'))){ if(t.disabled) return; return playerAct(t.getAttribute('data-act'), t); }
    }
    if((t = e.target.closest('[data-practice]'))){
      var pi = t.getAttribute('data-i');
      return practice(t.getAttribute('data-practice'), pi == null ? null : +pi);
    }
    if((t = e.target.closest('[data-mock]'))) return startMock(t.getAttribute('data-mock'));
    if((t = e.target.closest('[data-set]'))){ confirmReset = null; setPage(t.getAttribute('data-set')); return window.scrollTo(0, 0); }
    if((t = e.target.closest('[data-listview]'))) return listView(t.getAttribute('data-listview'));
    if((t = e.target.closest('[data-askreset]'))){ confirmReset = t.getAttribute('data-askreset'); var y = window.scrollY; setPage(confirmReset); return window.scrollTo(0, y); }
    if((t = e.target.closest('[data-doreset]'))){
      var rid = t.getAttribute('data-doreset');
      answers[rid] = {}; delete pos[rid]; saveAnswers(); save('saa.pos', pos);
      confirmReset = null; setPage(rid); return window.scrollTo(0, 0);
    }
    if((t = e.target.closest('[data-result]'))){
      var rb = t.getAttribute('data-result').split(':');
      return result(+rb[0], 'all', rb[1]);
    }
    if((t = e.target.closest('[data-filter]'))){
      var fb = t.getAttribute('data-filter').split(':');
      var fy = window.scrollY; result(+fb[0], fb[1], P && P.from); return window.scrollTo(0, fy);
    }
    if((t = e.target.closest('[data-attemptq]'))){
      var ab = t.getAttribute('data-attemptq').split(':');
      return showAttemptQ(+ab[0], +ab[1], P && P.from);
    }
    if((t = e.target.closest('[data-retryattempt]'))){
      var ra = attempts[+t.getAttribute('data-retryattempt')], rs = examById[ra.set];
      return startRetry(rs.questions.filter(function(qq){ return !isRight(qq, ra.ans[qq.n]); })
        .map(function(qq){ return { s: ra.set, n: qq.n }; }), rs.num + ' 本番モードで間違えた問題');
    }
    if((t = e.target.closest('[data-dtask]'))){
      var dt = t.getAttribute('data-dtask'), ti = taskItems(dt);
      return startRetry(ti.list, domLabel(dt) + (ti.again ? '（もう一度）' : '（間違い・未回答から）'));
    }
    if((t = e.target.closest('[data-retry]'))){
      if(t.disabled) return;
      var w = t.getAttribute('data-retry');
      return startRetry(w === 'wrong' ? wrongItems() : flagItems(), w === 'wrong' ? '間違えた問題の解き直し' : '見直しの印を付けた問題');
    }
    t = e.target.closest('[data-go]');
    if(!t) return;
    if(t.tagName === 'A') e.preventDefault();  // 教材内リンク: hash 遷移ではなく章表示に任せる
    go(t.getAttribute('data-go'), t.getAttribute('data-sec'));
  });

  var brand = document.getElementById('brand');
  brand.addEventListener('click', function(){ go('home'); });
  brand.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go('home'); }
  });
  menu.addEventListener('click', function(){
    nav.hidden = !nav.hidden;
    menu.setAttribute('aria-expanded', String(!nav.hidden));
  });
  var timer;
  q.addEventListener('input', function(){
    clearTimeout(timer);
    var v = q.value;
    timer = setTimeout(function(){
      if(v.trim().length === 0) go(currentTab);
      else { results(v); window.scrollTo(0, 0); }
    }, 140);
  });
  document.addEventListener('keydown', function(e){
    var typing = document.activeElement === q;
    if(e.key === '/' && !typing){ e.preventDefault(); q.focus(); return; }
    if(e.key === 'Escape' && typing){ q.value = ''; q.blur(); go(currentTab); return; }
    // 問題画面のキー操作：← → で移動、A〜F または 1〜6 で選択
    if(typing || !P || !P.list || document.body.getAttribute('data-view') !== 'play' || e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === 'ArrowLeft'){ playerAct('prev'); return; }
    if(e.key === 'ArrowRight'){ playerAct('next'); return; }
    var k = e.key.toUpperCase(), opts = itemAt(P.i).q.options.map(function(o){ return o.l; });
    var letter = /^[1-6]$/.test(k) ? opts[+k - 1] : (opts.indexOf(k) >= 0 ? k : null);
    if(letter){ var b = main.querySelector('[data-opt="' + letter + '"]'); if(b && b.getAttribute('aria-disabled') !== 'true') pickOption(letter); }
  });
  window.addEventListener('resize', function(){
    syncHeader();
    if(document.body.getAttribute('data-view') === 'read') nav.hidden = isNarrow();
  });

  buildNav();
  var startTab = 'read';
  try { startTab = localStorage.getItem('saa.tab') || 'read'; } catch(e){}
  go(startTab === 'solve' || startTab === 'review' ? startTab : 'home');
})();
</script>
