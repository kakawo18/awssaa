<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 388" role="img" aria-label="EC2のアプリがKMSで暗号化されたS3のオブジェクトを読むまでに通る3つの関門。経路はゲートウェイ型エンドポイントへのルートで、ここで止まるとタイムアウトになる。認可はIAMロールのポリシーとバケットポリシーをまとめて評価し、明示的な拒否があるか許可がなければ403になる。最後にKMSのキーポリシーでkms:Decryptが許可されていなければ403になる。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor">
  <defs>
    <marker id="arw-al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
    <marker id="arw-al-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity="0.65"/>
    </marker>
  </defs>
  <text x="10" y="16" font-size="10.5" fill-opacity="0.7">EC2のアプリが、KMSで暗号化したS3のオブジェクトを読むまで</text>
  <text x="120" y="36" font-size="9" text-anchor="middle" fill-opacity="0.75">通る順番</text>
  <text x="314" y="36" font-size="9" text-anchor="middle" fill-opacity="0.75">ここで止まると</text>
  <rect x="10" y="44" width="220" height="30" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="120" y="63" font-size="10.5" text-anchor="middle">EC2（IAMロール付き）</text>
  <line x1="120" y1="74" x2="120" y2="93" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-al)"/>
  <rect x="10" y="96" width="220" height="44" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="20" y="114" font-size="10.5">① 経路</text>
  <text x="20" y="130" font-size="9" fill-opacity="0.85">ルートテーブル → ゲートウェイ型エンドポイント</text>
  <line x1="230" y1="118" x2="256" y2="118" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw-al-g)"/>
  <rect x="260" y="100" width="110" height="36" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="315" y="116" font-size="10.5" text-anchor="middle" font-weight="700">タイムアウト</text>
  <text x="315" y="129" font-size="8.5" text-anchor="middle" fill-opacity="0.75">届いていない</text>
  <line x1="120" y1="140" x2="120" y2="159" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-al)"/>
  <rect x="10" y="162" width="220" height="44" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="20" y="180" font-size="10.5">② 認可</text>
  <text x="20" y="196" font-size="9" fill-opacity="0.85">IAMロールのポリシー ＋ バケットポリシー</text>
  <line x1="230" y1="184" x2="256" y2="184" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw-al-g)"/>
  <rect x="260" y="166" width="110" height="36" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="315" y="182" font-size="10.5" text-anchor="middle" font-weight="700">403</text>
  <text x="315" y="195" font-size="8.5" text-anchor="middle" fill-opacity="0.75">届いたが拒否</text>
  <line x1="120" y1="206" x2="120" y2="225" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-al)"/>
  <rect x="10" y="228" width="220" height="44" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="20" y="246" font-size="10.5">③ 鍵</text>
  <text x="20" y="262" font-size="9" fill-opacity="0.85">KMSキーポリシーの kms:Decrypt</text>
  <line x1="230" y1="250" x2="256" y2="250" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw-al-g)"/>
  <rect x="260" y="232" width="110" height="36" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="315" y="248" font-size="10.5" text-anchor="middle" font-weight="700">403</text>
  <text x="315" y="261" font-size="8.5" text-anchor="middle" fill-opacity="0.75">鍵を使えない</text>
  <line x1="120" y1="272" x2="120" y2="291" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-al)"/>
  <rect x="10" y="294" width="220" height="30" rx="15" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="120" y="313" font-size="10.5" text-anchor="middle">S3が復号して返す</text>
  <line x1="10" y1="334" x2="370" y2="334" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="348" font-size="10.5">タイムアウトなら経路を、403なら②か③を調べる</text>
  <text x="10" y="366" font-size="9.5" fill-opacity="0.8">②は、どれかに明示的な拒否があるか、どこにも許可が</text>
  <text x="10" y="380" font-size="9.5" fill-opacity="0.8">なければ拒否（→第5章 5.1）</text>
</svg>
