<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 365" role="img" aria-label="コンピューティングの選び方。イベントで起動して15分以内に終わる処理ならLambda。コンテナで動かすなら、Kubernetesの互換が必須ならEKS、それ以外はECSで、サーバーを管理しないならFargate。15分を超えるバッチをジョブキューで大量に回すならAWS Batch。それ以外でOSまで制御するならEC2。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor">
  <defs>
    <marker id="arw-cp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
    <marker id="arw-cp-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity="0.65"/>
    </marker>
  </defs>
  <text x="10" y="16" font-size="10.5" fill-opacity="0.7">上から順に確かめ、「はい」になった所が答え</text>
  <rect x="10" y="28" width="196" height="44" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="108" y="47" text-anchor="middle" font-size="10">イベントで起動し、</text>
  <text x="108" y="62" text-anchor="middle" font-size="10">15分以内に終わる処理？</text>
  <line x1="206" y1="50" x2="228" y2="50" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-cp)"/>
  <text x="217" y="42" text-anchor="middle" font-size="8" fill-opacity="0.8">はい</text>
  <rect x="232" y="28" width="138" height="44" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="301" y="47" text-anchor="middle" font-size="11">Lambda</text>
  <text x="301" y="62" text-anchor="middle" font-size="8.5" fill-opacity="0.75">実行した時間だけ課金</text>
  <line x1="108" y1="72" x2="108" y2="91" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.4" marker-end="url(#arw-cp-g)"/>
  <text x="114" y="86" font-size="8.5" fill-opacity="0.8">いいえ</text>
  <rect x="10" y="94" width="196" height="44" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="108" y="120" text-anchor="middle" font-size="10">コンテナで動かす？</text>
  <line x1="206" y1="116" x2="228" y2="116" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-cp)"/>
  <text x="217" y="108" text-anchor="middle" font-size="8" fill-opacity="0.8">はい</text>
  <rect x="232" y="94" width="138" height="94" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="242" y="111" font-size="8.5" fill-opacity="0.75">Kubernetesの互換が必須</text>
  <text x="242" y="125" font-size="10.5">→ EKS</text>
  <text x="242" y="139" font-size="8.5" fill-opacity="0.75">AWSの仕組みで簡単に</text>
  <text x="242" y="153" font-size="10.5">→ ECS</text>
  <text x="242" y="167" font-size="8.5" fill-opacity="0.75">サーバーの管理をしない</text>
  <text x="242" y="181" font-size="10.5">→ 実行環境はFargate</text>
  <line x1="108" y1="138" x2="108" y2="207" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.4" marker-end="url(#arw-cp-g)"/>
  <text x="114" y="177" font-size="8.5" fill-opacity="0.8">いいえ</text>
  <rect x="10" y="210" width="196" height="44" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="108" y="229" text-anchor="middle" font-size="10">15分を超えるバッチを</text>
  <text x="108" y="244" text-anchor="middle" font-size="10">ジョブキューで大量に回す？</text>
  <line x1="206" y1="232" x2="228" y2="232" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-cp)"/>
  <text x="217" y="224" text-anchor="middle" font-size="8" fill-opacity="0.8">はい</text>
  <rect x="232" y="210" width="138" height="44" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="301" y="229" text-anchor="middle" font-size="11">AWS Batch</text>
  <text x="301" y="244" text-anchor="middle" font-size="8.5" fill-opacity="0.75">スポットで安く回せる</text>
  <line x1="108" y1="254" x2="108" y2="273" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.4" marker-end="url(#arw-cp-g)"/>
  <text x="114" y="268" font-size="8.5" fill-opacity="0.8">いいえ</text>
  <rect x="10" y="276" width="196" height="44" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="108" y="295" text-anchor="middle" font-size="11">EC2</text>
  <text x="108" y="310" text-anchor="middle" font-size="8.5" fill-opacity="0.75">OS・ミドルウェアまで制御する</text>
  <line x1="10" y1="334" x2="370" y2="334" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="355" font-size="9.5" fill-opacity="0.8">コードを上げるだけでWebアプリを動かす → Elastic Beanstalk</text>
</svg>
