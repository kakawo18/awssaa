<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 316" role="img" aria-label="データベースの打ち手が入る位置と、減らすもの。RDS Proxyは多数のLambdaからの接続を束ねて接続の数を減らす。ElastiCacheは同じクエリの結果を返して実行回数を減らす。リードレプリカは読み取りを分けるが回数は減らない。書き込みはプライマリにしか行けないため、どれを足しても減らない。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor">
  <defs>
    <marker id="arw-db3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
    <marker id="arw-db3-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity="0.65"/>
    </marker>
  </defs>
  <text x="10" y="16" font-size="10.5" fill-opacity="0.7">打ち手が入る場所と、減らすもの</text>
  <rect x="270" y="30" width="100" height="72" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="320" y="62" font-size="10.5" text-anchor="middle">プライマリ</text>
  <text x="320" y="77" font-size="8.5" text-anchor="middle" fill-opacity="0.75">（書き込み先）</text>
  <rect x="10" y="30" width="80" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="50" y="51" font-size="9" text-anchor="middle">Lambda（多数）</text>
  <line x1="90" y1="35" x2="136" y2="47" stroke="currentColor" stroke-opacity="0.45" stroke-width="1"/>
  <line x1="90" y1="41" x2="136" y2="47" stroke="currentColor" stroke-opacity="0.45" stroke-width="1"/>
  <line x1="90" y1="47" x2="136" y2="47" stroke="currentColor" stroke-opacity="0.45" stroke-width="1"/>
  <line x1="90" y1="53" x2="136" y2="47" stroke="currentColor" stroke-opacity="0.45" stroke-width="1"/>
  <line x1="90" y1="59" x2="136" y2="47" stroke="currentColor" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="140" y="30" width="90" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="185" y="51" font-size="10" text-anchor="middle">① RDS Proxy</text>
  <line x1="230" y1="47" x2="266" y2="47" stroke="#3F78D8" stroke-width="2.5" marker-end="url(#arw-db3)"/>
  <rect x="10" y="78" width="80" height="30" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="50" y="97" font-size="8.5" text-anchor="middle">アプリ（書き込み）</text>
  <line x1="90" y1="93" x2="266" y2="93" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-db3)"/>
  <text x="178" y="88" font-size="8.5" text-anchor="middle" fill-opacity="0.85">④ 書き込みはプライマリだけ</text>
  <rect x="10" y="150" width="80" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="50" y="171" font-size="8.5" text-anchor="middle">アプリ（読み取り）</text>
  <rect x="140" y="150" width="90" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="185" y="171" font-size="10" text-anchor="middle">② ElastiCache</text>
  <rect x="270" y="150" width="100" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="320" y="171" font-size="10" text-anchor="middle">③ リードレプリカ</text>
  <line x1="90" y1="167" x2="136" y2="167" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-db3)"/>
  <line x1="230" y1="167" x2="266" y2="167" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-db3)"/>
  <text x="248" y="162" font-size="8" text-anchor="middle" fill-opacity="0.8">ミス</text>
  <text x="185" y="198" font-size="8.5" text-anchor="middle" fill-opacity="0.8">ヒットならここで返す</text>
  <line x1="320" y1="102" x2="320" y2="146" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw-db3-g)"/>
  <text x="326" y="128" font-size="8.5" fill-opacity="0.8">非同期で複製</text>
  <line x1="10" y1="212" x2="370" y2="212" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="230" font-size="9.5">① 接続を束ねる → 減るのは接続の数（クエリは減らない）</text>
  <text x="10" y="250" font-size="9.5">② 結果を覚えて返す → 同じクエリの実行回数が減る</text>
  <text x="10" y="270" font-size="9.5">③ 読み取りを分ける → 回数は同じで、負荷が分散する</text>
  <text x="10" y="290" font-size="9.5" font-weight="700">④ 書き込みの飽和は①〜③のどれでも減らない</text>
  <text x="26" y="306" font-size="9" fill-opacity="0.8">→ Aurora・シャーディング・SQSでためて平準化</text>
</svg>
