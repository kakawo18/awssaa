<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" role="img" aria-label="実際に使える権限の範囲。SCP、アクセス許可境界、IDベースのポリシーの3つがすべて許可する重なりだけが使える。SCPと境界は許可を与えず上限を絞るだけで、どこかに明示的な拒否があれば重なりの中でも拒否される。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor">
  <defs>
    <clipPath id="iam-c1"><circle cx="148" cy="112" r="78"/></clipPath>
    <clipPath id="iam-c2"><circle cx="232" cy="112" r="78"/></clipPath>
    <pattern id="iam-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="2" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- the three sets -->
  <circle cx="148" cy="112" r="78" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/>
  <circle cx="232" cy="112" r="78" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="5 3"/>
  <circle cx="190" cy="180" r="78" fill="currentColor" fill-opacity="0.04" stroke="#3F78D8" stroke-width="1.8"/>

  <!-- intersection of all three -->
  <g clip-path="url(#iam-c1)">
    <g clip-path="url(#iam-c2)">
      <circle cx="190" cy="180" r="78" fill="#3F78D8" fill-opacity="0.42"/>
    </g>
  </g>
  <text x="190" y="132" text-anchor="middle" font-size="11" font-weight="700">✓ 使える</text>
  <text x="190" y="147" text-anchor="middle" font-size="9.5" fill-opacity="0.85">3つの重なり</text>

  <!-- explicit deny cutting into the overlap -->
  <rect x="186" y="154" width="22" height="20" fill="url(#iam-hatch)" stroke="currentColor" stroke-width="1.2"/>
  <line x1="208" y1="164" x2="252" y2="176" stroke="currentColor" stroke-opacity="0.7"/>
  <text x="254" y="181" font-size="10" font-weight="700">✕ 明示的な拒否</text>

  <!-- labels -->
  <text x="88" y="64" text-anchor="middle" font-size="11.5">SCP</text>
  <text x="88" y="79" text-anchor="middle" font-size="9.5" fill-opacity="0.75">組織の上限</text>
  <text x="292" y="64" text-anchor="middle" font-size="11.5">アクセス許可境界</text>
  <text x="292" y="79" text-anchor="middle" font-size="9.5" fill-opacity="0.75">委譲したときの上限</text>
  <text x="190" y="228" text-anchor="middle" font-size="11.5">IDベースのポリシー</text>
  <text x="190" y="243" text-anchor="middle" font-size="9.5" fill-opacity="0.75">ここで初めて許可が与えられる</text>

  <!-- notes -->
  <line x1="10" y1="268" x2="370" y2="268" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="286" font-size="10.5">SCPと境界は許可を与えない（上限を絞るだけ）。</text>
  <text x="10" y="303" font-size="10.5">重なりの中でも、どこかに明示的な拒否があれば拒否。</text>
  <text x="10" y="320" font-size="9.5" fill-opacity="0.7">リソースベースのポリシーやセッションポリシーが関わる場合は評価が加わる</text>
</svg>
