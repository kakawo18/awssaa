<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" role="img" aria-label="Lambdaの料金をメモリと実行時間の積で比べた図。現在は1GBで60秒の60GB秒。Aは2GBで25秒の50GB秒、Bは0.5GBで130秒の65GB秒、Cは2GBで35秒の70GB秒、Dは3GBで22秒の66GB秒。現在より料金が下がり、実行時間も短いのはAだけ。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor">
  <text x="10" y="16" font-size="10.5" fill-opacity="0.7">料金の目安 ＝ メモリ（GB）× 実行時間（秒）</text>
  <line x1="300" y1="30" x2="300" y2="214" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="300" y="228" text-anchor="middle" font-size="9" fill-opacity="0.8">現在の料金</text>
  <rect x="96" y="36" width="204.0" height="18" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="305.0" y="49" font-size="9.5">60</text>
  <text x="10" y="44" font-size="10.5">現在</text>
  <text x="10" y="57" font-size="8.5" fill-opacity="0.75">1GB×60秒</text>
  <rect x="96" y="72" width="170.0" height="18" rx="3" fill="#3F78D8" fill-opacity="0.3" stroke="#3F78D8" stroke-width="1.4"/>
  <text x="271.0" y="85" font-size="9.5">50 ✓</text>
  <text x="10" y="80" font-size="10.5">A</text>
  <text x="10" y="93" font-size="8.5" fill-opacity="0.75">2GB×25秒</text>
  <rect x="96" y="108" width="221.0" height="18" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="322.0" y="121" font-size="9.5">65</text>
  <text x="10" y="116" font-size="10.5">B</text>
  <text x="10" y="129" font-size="8.5" fill-opacity="0.75">0.5GB×130秒</text>
  <rect x="96" y="144" width="238.0" height="18" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="339.0" y="157" font-size="9.5">70</text>
  <text x="10" y="152" font-size="10.5">C</text>
  <text x="10" y="165" font-size="8.5" fill-opacity="0.75">2GB×35秒</text>
  <rect x="96" y="180" width="224.4" height="18" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="325.4" y="193" font-size="9.5">66</text>
  <text x="10" y="188" font-size="10.5">D</text>
  <text x="10" y="201" font-size="8.5" fill-opacity="0.75">3GB×22秒</text>
  <text x="96" y="228" font-size="9" fill-opacity="0.75">単位：GB秒</text>
  <line x1="10" y1="240" x2="370" y2="240" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="258" font-size="10.5">点線より左なら安くなる。時間も短いのはAだけ</text>
  <text x="10" y="276" font-size="9.5" fill-opacity="0.8">B：安いメモリでも時間が延びて高くなる</text>
  <text x="10" y="293" font-size="9.5" fill-opacity="0.8">C・D：速くなるが、メモリの増え方の方が大きい</text>
</svg>
