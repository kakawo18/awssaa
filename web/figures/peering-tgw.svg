<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" role="img" aria-label="VPCピアリングとTransit Gatewayの比較。ピアリングはAとB、BとCをつないでもAとCは通信できず（推移しない）、全組み合わせを個別につなぐ必要がある。Transit Gatewayはハブに各VPCとオンプレミスをつなぐだけで、ルートテーブルの設定しだいで相互に通信できる。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor">
  <line x1="188" y1="8" x2="188" y2="232" stroke="currentColor" stroke-opacity="0.15"/>
  <text x="94" y="20" text-anchor="middle" font-size="11.5">VPCピアリング</text>
  <text x="284" y="20" text-anchor="middle" font-size="11.5">Transit Gateway</text>

  <!-- peering: A - B - C, A-C not transitive -->
  <line x1="78" y1="70" x2="110" y2="70" stroke="#3F78D8" stroke-width="2"/>
  <line x1="124" y1="84" x2="104" y2="136" stroke="#3F78D8" stroke-width="2"/>
  <line x1="64" y1="84" x2="84" y2="136" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="34" y="56" width="44" height="28" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.55"/>
  <text x="56" y="75" text-anchor="middle" font-size="11">A</text>
  <rect x="110" y="56" width="44" height="28" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.55"/>
  <text x="132" y="75" text-anchor="middle" font-size="11">B</text>
  <rect x="72" y="136" width="44" height="28" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.55"/>
  <text x="94" y="155" text-anchor="middle" font-size="11">C</text>
  <text x="94" y="62" text-anchor="middle" font-size="9.5">✓</text>
  <text x="122" y="118" font-size="9.5">✓</text>
  <rect x="40" y="101" width="26" height="18" rx="4" fill="#3F78D8"/>
  <text x="53" y="114" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">✕</text>
  <text x="14" y="188" font-size="10">AとCはBを経由できない</text>
  <text x="14" y="203" font-size="10">（推移しない）</text>
  <text x="14" y="224" font-size="9.5" fill-opacity="0.75">VPCがn個なら n(n−1)/2 本</text>

  <!-- TGW hub -->
  <circle cx="284" cy="112" r="24" fill="#3F78D8" fill-opacity="0.18" stroke="#3F78D8" stroke-width="1.8"/>
  <text x="284" y="116" text-anchor="middle" font-size="10.5">TGW</text>
  <g stroke="#3F78D8" stroke-width="1.6">
    <line x1="284" y1="88" x2="284" y2="62"/>
    <line x1="305" y1="100" x2="334" y2="78"/>
    <line x1="263" y1="100" x2="234" y2="78"/>
    <line x1="303" y1="128" x2="330" y2="150"/>
    <line x1="265" y1="128" x2="238" y2="150"/>
    <line x1="284" y1="136" x2="284" y2="168"/>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <rect x="266" y="40" width="36" height="22" rx="5" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.55"/>
    <text x="284" y="56">A</text>
    <rect x="326" y="58" width="36" height="22" rx="5" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.55"/>
    <text x="344" y="74">B</text>
    <rect x="206" y="58" width="36" height="22" rx="5" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.55"/>
    <text x="224" y="74">C</text>
    <rect x="322" y="148" width="36" height="22" rx="5" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.55"/>
    <text x="340" y="164">D</text>
    <rect x="210" y="148" width="36" height="22" rx="5" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.55"/>
    <text x="228" y="164">E</text>
    <rect x="240" y="168" width="88" height="24" rx="5" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 3"/>
    <text x="284" y="184" font-size="9.5">オンプレミス</text>
  </g>
  <text x="200" y="210" font-size="10">ハブにつなぐだけで相互に通信</text>
  <text x="200" y="224" font-size="9.5" fill-opacity="0.75">DX／VPNもつなげる</text>

  <!-- notes -->
  <line x1="10" y1="240" x2="370" y2="240" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="258" font-size="10.5">2つのVPCだけ → ピアリング（時間料金なし・安い）</text>
  <text x="10" y="276" font-size="10.5">多数のVPC・オンプレミスもまとめる → Transit Gateway</text>
  <text x="10" y="293" font-size="9.5" fill-opacity="0.75">TGWでもルートテーブルを分ければ、本番と開発を隔離できる</text>
</svg>
