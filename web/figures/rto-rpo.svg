<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 268" role="img" aria-label="RPOとRTOの時間軸。13時55分に最後のバックアップ、14時00分に障害、14時20分に復旧。障害より前の5分がRPO（失われるデータ）、障害より後の20分がRTO（止まっている時間）。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor">
  <text x="10" y="18" font-size="10.5" fill-opacity="0.7">障害より前＝失うデータ（RPO）／障害より後＝止まる時間（RTO）</text>

  <!-- RPO bracket (above axis) -->
  <rect x="76" y="40" width="46" height="22" rx="4" fill="#3F78D8" fill-opacity="0.16" stroke="#3F78D8" stroke-width="1.4"/>
  <text x="99" y="55" text-anchor="middle" font-size="10.5">5分</text>
  <text x="10" y="55" font-size="11.5">RPO実績</text>
  <text x="128" y="55" font-size="10.5" fill-opacity="0.8">13:55〜14:00の更新が失われる</text>

  <!-- RTO bracket (below axis) -->
  <rect x="122" y="134" width="182" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.4"/>
  <text x="213" y="149" text-anchor="middle" font-size="10.5">20分（サービス停止）</text>
  <text x="10" y="149" font-size="11.5">RTO実績</text>

  <!-- axis -->
  <line x1="30" y1="96" x2="356" y2="96" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.6"/>
  <polygon points="362,96 352,91 352,101" fill="currentColor" fill-opacity="0.5"/>
  <line x1="76" y1="62" x2="76" y2="96" stroke="#3F78D8" stroke-opacity="0.6" stroke-dasharray="3 3"/>
  <line x1="122" y1="62" x2="122" y2="134" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <line x1="304" y1="96" x2="304" y2="134" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="3 3"/>

  <circle cx="76" cy="96" r="6" fill="#3F78D8"/>
  <text x="76" y="120" text-anchor="middle" font-size="10.5">13:55</text>
  <text x="10" y="84" font-size="9.5" fill-opacity="0.75">最後のバックアップ</text>

  <circle cx="122" cy="96" r="8" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6"/>
  <text x="122" y="100" text-anchor="middle" font-size="10" font-weight="700">✕</text>
  <text x="122" y="120" text-anchor="middle" font-size="10.5">14:00</text>
  <text x="138" y="84" font-size="9.5" fill-opacity="0.75">障害発生</text>

  <circle cx="304" cy="96" r="8" fill="#3F78D8" fill-opacity="0.16" stroke="#3F78D8" stroke-width="1.6"/>
  <text x="304" y="100" text-anchor="middle" font-size="10" font-weight="700">✓</text>
  <text x="304" y="120" text-anchor="middle" font-size="10.5">14:20</text>
  <text x="304" y="84" text-anchor="middle" font-size="9.5" fill-opacity="0.75">復旧完了</text>

  <!-- requirement check -->
  <line x1="10" y1="176" x2="370" y2="176" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="196" font-size="10.5" fill-opacity="0.7">設問の要件と比べる</text>
  <text x="10" y="216" font-size="11">✓ 要件「RPO 15分・RTO 30分」→ 5分・20分なので満たす</text>
  <text x="10" y="236" font-size="11">✕ 要件「RPO 1分」→ 5分間隔のバックアップでは足りない</text>
  <text x="24" y="254" font-size="10" fill-opacity="0.75">同期レプリケーションか、遅延が秒単位の非同期レプリケーションが必要</text>
</svg>
