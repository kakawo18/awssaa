<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" role="img" aria-label="S3ストレージクラスの位置関係。縦軸が保管コスト、横軸が取り出しにかかる時間。Standardが最も高く即時、Deep Archiveが最も安く取り出しに12から48時間かかる。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor">
  <text x="10" y="18" font-size="10.5" fill-opacity="0.7">↑ 保管コスト</text>

  <line x1="50" y1="30" x2="50" y2="248" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/>
  <line x1="50" y1="248" x2="356" y2="248" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/>
  <text x="44" y="44" text-anchor="end" font-size="10" fill-opacity="0.7">高い</text>
  <text x="44" y="244" text-anchor="end" font-size="10" fill-opacity="0.7">安い</text>

  <line x1="150" y1="36" x2="150" y2="248" stroke="currentColor" stroke-opacity="0.18" stroke-dasharray="3 4"/>
  <line x1="268" y1="36" x2="268" y2="248" stroke="currentColor" stroke-opacity="0.18" stroke-dasharray="3 4"/>

  <text x="95" y="266" text-anchor="middle" font-size="10" fill-opacity="0.75">即時（ミリ秒）</text>
  <text x="209" y="266" text-anchor="middle" font-size="10" fill-opacity="0.75">数分〜数時間</text>
  <text x="312" y="266" text-anchor="middle" font-size="10" fill-opacity="0.75">12〜48時間</text>
  <text x="356" y="288" text-anchor="end" font-size="10.5" fill-opacity="0.7">取り出しにかかる時間 →</text>

  <circle cx="80" cy="52" r="5" fill="#3F78D8"/>
  <text x="92" y="56" font-size="11">S3 Standard</text>
  <circle cx="80" cy="84" r="5" fill="#3F78D8"/>
  <text x="92" y="88" font-size="11">Intelligent-Tiering</text>
  <circle cx="80" cy="116" r="5" fill="#3F78D8"/>
  <text x="92" y="120" font-size="11">Standard-IA</text>
  <circle cx="80" cy="148" r="5" fill="#3F78D8"/>
  <text x="92" y="152" font-size="11">One Zone-IA（単一AZ）</text>
  <circle cx="80" cy="180" r="5" fill="#3F78D8"/>
  <text x="92" y="184" font-size="11">Glacier Instant Retrieval</text>
  <circle cx="209" cy="212" r="5" fill="#3F78D8"/>
  <text x="221" y="216" font-size="11">Glacier Flexible</text>
  <circle cx="312" cy="238" r="5" fill="#3F78D8"/>
  <text x="300" y="242" text-anchor="end" font-size="11">Deep Archive</text>
</svg>
