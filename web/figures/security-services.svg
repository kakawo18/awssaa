<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" role="img" aria-label="監視と検知のサービスの守備範囲。記録するサービスは、操作を残すCloudTrail、状態を見るCloudWatch、設定の変化とルールへの準拠を見るConfig。見つけるサービスは、不審な動きのGuardDuty、脆弱性のInspector、機密データのMacie。それぞれの検出結果をSecurity Hub CSPMが集めて評価し、原因や影響範囲はDetectiveで調べる。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor">
  <defs>
    <marker id="arw-sc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
    <marker id="arw-sc-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity="0.65"/>
    </marker>
  </defs>
  <text x="95" y="30" font-size="10" text-anchor="middle" fill-opacity="0.8">記録する（何が起きたか）</text>
  <text x="285" y="30" font-size="10" text-anchor="middle" fill-opacity="0.8">見つける（何が危ないか）</text>
  <rect x="10" y="40" width="170" height="40" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="95" y="57" font-size="10.5" text-anchor="middle">CloudTrail</text>
  <text x="95" y="72" font-size="8.5" text-anchor="middle" fill-opacity="0.8">操作：誰がいつ何をした</text>
  <rect x="200" y="40" width="170" height="40" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="285" y="57" font-size="10.5" text-anchor="middle">GuardDuty</text>
  <text x="285" y="72" font-size="8.5" text-anchor="middle" fill-opacity="0.8">不審な動き（ログを分析）</text>
  <rect x="10" y="88" width="170" height="40" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="95" y="105" font-size="10.5" text-anchor="middle">CloudWatch</text>
  <text x="95" y="120" font-size="8.5" text-anchor="middle" fill-opacity="0.8">状態：メトリクス・ログ</text>
  <rect x="200" y="88" width="170" height="40" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="285" y="105" font-size="10.5" text-anchor="middle">Inspector</text>
  <text x="285" y="120" font-size="8.5" text-anchor="middle" fill-opacity="0.8">脆弱性（EC2・ECR・Lambda）</text>
  <rect x="10" y="136" width="170" height="40" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="95" y="153" font-size="10.5" text-anchor="middle">Config</text>
  <text x="95" y="168" font-size="8.5" text-anchor="middle" fill-opacity="0.8">設定：変更履歴・ルール準拠</text>
  <rect x="200" y="136" width="170" height="40" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="285" y="153" font-size="10.5" text-anchor="middle">Macie</text>
  <text x="285" y="168" font-size="8.5" text-anchor="middle" fill-opacity="0.8">S3の機密データ（個人情報）</text>
  <line x1="285" y1="184" x2="285" y2="206" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-sc)"/>
  <line x1="95" y1="184" x2="95" y2="206" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-sc)"/>
  <text x="103" y="199" font-size="8.5" fill-opacity="0.8">ルールの評価</text>
  <text x="293" y="199" font-size="8.5" fill-opacity="0.8">検出結果</text>
  <rect x="10" y="210" width="360" height="40" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="190" y="227" font-size="10.5" text-anchor="middle">Security Hub CSPM</text>
  <text x="190" y="242" font-size="8.5" text-anchor="middle" fill-opacity="0.85">検出結果を1か所に集め、基準に沿って評価する</text>
  <line x1="190" y1="250" x2="190" y2="266" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-sc-g)"/>
  <rect x="10" y="270" width="360" height="36" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="190" y="286" font-size="10.5" text-anchor="middle">Detective</text>
  <text x="190" y="299" font-size="8.5" text-anchor="middle" fill-opacity="0.85">起きた事象の原因と影響範囲を、関係のグラフで調べる</text>
  <text x="10" y="326" font-size="9" fill-opacity="0.8">設問の動詞で選ぶ：記録＝CloudTrail、準拠＝Config、検知＝GuardDuty</text>
</svg>
