<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" role="img" aria-label="仕事の分担と同報の違い。1つのSQSキューを複数のワーカーで受けると、各メッセージはどれか1台だけが処理する。SNSトピックから複数のSQSキューへファンアウトすると、同じメッセージがすべてのキューに複製され、決済・配送・通知がそれぞれ独立して処理する。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor">
  <defs>
    <marker id="arw-fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
  </defs>

  <!-- top: work sharing -->
  <text x="10" y="18" font-size="11.5">分担：1つのキューを複数のワーカーで</text>
  <rect x="10" y="62" width="60" height="30" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="40" y="81" text-anchor="middle" font-size="10">送信側</text>
  <rect x="104" y="56" width="98" height="42" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="153" y="73" text-anchor="middle" font-size="10.5">SQSキュー</text>
  <text x="153" y="89" text-anchor="middle" font-size="9.5" fill-opacity="0.85">m1 m2 m3</text>
  <line x1="70" y1="77" x2="100" y2="77" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-fo)"/>
  <g font-size="10" text-anchor="middle">
    <rect x="270" y="30" width="96" height="26" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="318" y="47">ワーカー1：m1</text>
    <rect x="270" y="64" width="96" height="26" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="318" y="81">ワーカー2：m2</text>
    <rect x="270" y="98" width="96" height="26" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="318" y="115">ワーカー3：m3</text>
  </g>
  <line x1="202" y1="70" x2="266" y2="44" stroke="#3F78D8" stroke-width="1.4" marker-end="url(#arw-fo)"/>
  <line x1="202" y1="77" x2="266" y2="77" stroke="#3F78D8" stroke-width="1.4" marker-end="url(#arw-fo)"/>
  <line x1="202" y1="84" x2="266" y2="110" stroke="#3F78D8" stroke-width="1.4" marker-end="url(#arw-fo)"/>
  <text x="10" y="142" font-size="10">各メッセージを処理するのは1台だけ。台数を増やすと処理能力が上がる</text>

  <line x1="10" y1="156" x2="370" y2="156" stroke="currentColor" stroke-opacity="0.2"/>

  <!-- bottom: fan-out -->
  <text x="10" y="178" font-size="11.5">同報：SNSから複数のキューへ（ファンアウト）</text>
  <rect x="10" y="232" width="60" height="30" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="40" y="251" text-anchor="middle" font-size="10">送信側</text>
  <rect x="96" y="226" width="80" height="42" rx="6" fill="#3F78D8" fill-opacity="0.22" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="136" y="243" text-anchor="middle" font-size="10.5">SNS</text>
  <text x="136" y="259" text-anchor="middle" font-size="9.5" fill-opacity="0.85">トピック</text>
  <line x1="70" y1="247" x2="92" y2="247" stroke="#3F78D8" stroke-width="1.6" marker-end="url(#arw-fo)"/>
  <g font-size="10" text-anchor="middle">
    <rect x="214" y="192" width="70" height="26" rx="5" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.2"/>
    <text x="249" y="209">キュー：m1</text>
    <rect x="214" y="234" width="70" height="26" rx="5" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.2"/>
    <text x="249" y="251">キュー：m1</text>
    <rect x="214" y="276" width="70" height="26" rx="5" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.2"/>
    <text x="249" y="293">キュー：m1</text>
    <rect x="300" y="192" width="66" height="26" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="333" y="209">決済</text>
    <rect x="300" y="234" width="66" height="26" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="333" y="251">配送</text>
    <rect x="300" y="276" width="66" height="26" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="333" y="293">通知</text>
  </g>
  <line x1="176" y1="240" x2="210" y2="206" stroke="#3F78D8" stroke-width="1.4" marker-end="url(#arw-fo)"/>
  <line x1="176" y1="247" x2="210" y2="247" stroke="#3F78D8" stroke-width="1.4" marker-end="url(#arw-fo)"/>
  <line x1="176" y1="254" x2="210" y2="288" stroke="#3F78D8" stroke-width="1.4" marker-end="url(#arw-fo)"/>
  <line x1="284" y1="205" x2="296" y2="205" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4"/>
  <line x1="284" y1="247" x2="296" y2="247" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4"/>
  <line x1="284" y1="289" x2="296" y2="289" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4"/>
  <text x="10" y="322" font-size="10">同じメッセージがすべてのキューに届く。1つが止まっても</text>
  <text x="10" y="336" font-size="10">ほかは処理を続け、止まった処理は復旧後にキューから再開できる</text>
</svg>
