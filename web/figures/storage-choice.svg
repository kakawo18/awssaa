<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 396" role="img" aria-label="ストレージの選び方。オンプレミスから使い続けるならStorage Gateway。APIでオブジェクトとして読み書きするならS3。複数のインスタンスで同時に共有するなら、Linux・NFSはEFS、Windows・SMBはFSx for Windows、HPCやS3連携はFSx for Lustre。1台用で停止時に消えてよい一時領域ならインスタンスストア、それ以外はEBS。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor">
  <defs>
    <marker id="arw-st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
    <marker id="arw-st-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity="0.65"/>
    </marker>
  </defs>
  <text x="10" y="16" font-size="10.5" fill-opacity="0.7">上から順に確かめ、「はい」になった所が答え</text>
  <rect x="10" y="28" width="196" height="44" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="108" y="47" text-anchor="middle" font-size="10">オンプレミスのアプリから</text>
  <text x="108" y="62" text-anchor="middle" font-size="10">AWSのストレージを使い続ける？</text>
  <line x1="206" y1="50" x2="228" y2="50" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-st)"/>
  <text x="217" y="42" text-anchor="middle" font-size="8" fill-opacity="0.8">はい</text>
  <rect x="232" y="28" width="138" height="44" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="301" y="47" text-anchor="middle" font-size="11">Storage Gateway</text>
  <text x="301" y="62" text-anchor="middle" font-size="8.5" fill-opacity="0.75">移行・同期だけならDataSync</text>
  <line x1="108" y1="72" x2="108" y2="91" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.4" marker-end="url(#arw-st-g)"/>
  <text x="114" y="86" font-size="8.5" fill-opacity="0.8">いいえ</text>
  <rect x="10" y="94" width="196" height="44" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="108" y="113" text-anchor="middle" font-size="10">APIでファイルを</text>
  <text x="108" y="128" text-anchor="middle" font-size="10">オブジェクトとして読み書きする？</text>
  <line x1="206" y1="116" x2="228" y2="116" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-st)"/>
  <text x="217" y="108" text-anchor="middle" font-size="8" fill-opacity="0.8">はい</text>
  <rect x="232" y="94" width="138" height="44" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="301" y="113" text-anchor="middle" font-size="11">S3</text>
  <text x="301" y="128" text-anchor="middle" font-size="8.5" fill-opacity="0.75">頻度でストレージクラスを選ぶ</text>
  <line x1="108" y1="138" x2="108" y2="157" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.4" marker-end="url(#arw-st-g)"/>
  <text x="114" y="152" font-size="8.5" fill-opacity="0.8">いいえ</text>
  <rect x="10" y="160" width="196" height="44" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="108" y="179" text-anchor="middle" font-size="10">複数のインスタンスから</text>
  <text x="108" y="194" text-anchor="middle" font-size="10">同時にファイルを共有する？</text>
  <line x1="206" y1="182" x2="228" y2="182" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-st)"/>
  <text x="217" y="174" text-anchor="middle" font-size="8" fill-opacity="0.8">はい</text>
  <rect x="232" y="160" width="138" height="94" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="242" y="177" font-size="8.5" fill-opacity="0.75">Linux・NFS</text>
  <text x="242" y="191" font-size="10.5">→ EFS</text>
  <text x="242" y="205" font-size="8.5" fill-opacity="0.75">Windows・SMB・AD</text>
  <text x="242" y="219" font-size="10.5">→ FSx for Windows</text>
  <text x="242" y="233" font-size="8.5" fill-opacity="0.75">HPC・S3と連携</text>
  <text x="242" y="247" font-size="10.5">→ FSx for Lustre</text>
  <line x1="108" y1="204" x2="108" y2="273" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.4" marker-end="url(#arw-st-g)"/>
  <text x="114" y="243" font-size="8.5" fill-opacity="0.8">いいえ</text>
  <rect x="10" y="276" width="196" height="44" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="108" y="295" text-anchor="middle" font-size="10">1台で使う一時領域で、</text>
  <text x="108" y="310" text-anchor="middle" font-size="10">停止したら消えてもよい？</text>
  <line x1="206" y1="298" x2="228" y2="298" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-st)"/>
  <text x="217" y="290" text-anchor="middle" font-size="8" fill-opacity="0.8">はい</text>
  <rect x="232" y="276" width="138" height="44" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="301" y="295" text-anchor="middle" font-size="11">インスタンスストア</text>
  <text x="301" y="310" text-anchor="middle" font-size="8.5" fill-opacity="0.75">キャッシュ・作業用の領域</text>
  <line x1="108" y1="320" x2="108" y2="339" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.4" marker-end="url(#arw-st-g)"/>
  <text x="114" y="334" font-size="8.5" fill-opacity="0.8">いいえ</text>
  <rect x="10" y="342" width="196" height="44" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="108" y="361" text-anchor="middle" font-size="11">EBS</text>
  <text x="108" y="376" text-anchor="middle" font-size="8.5" fill-opacity="0.75">1台用の永続ブロック（同じAZ内）</text>
</svg>
