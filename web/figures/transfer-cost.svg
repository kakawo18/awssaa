<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 360" role="img" aria-label="データ転送料金がかかる経路。インターネットからの受信は無料、インターネットへの送信は有料。同じAZ内のプライベートIPでの通信は無料、AZ間は両方向に有料、リージョン間も有料。AWSのオリジンからCloudFrontへの転送は無料で、CloudFrontから利用者への配信は有料。VPCからS3へは、NAT Gateway経由だと時間料金と処理料金がかかり、ゲートウェイ型エンドポイント経由なら無料。" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif" font-size="12" fill="currentColor">
  <defs>
    <marker id="arw-tc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3F78D8"/>
    </marker>
    <marker id="arw-tc-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor" fill-opacity="0.65"/>
    </marker>
  </defs>
  <rect x="10" y="24" width="120" height="30" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="70" y="43" font-size="10" text-anchor="middle">インターネット</text>
  <rect x="250" y="24" width="120" height="30" rx="6" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="310" y="43" font-size="10" text-anchor="middle">CloudFront</text>
  <line x1="250" y1="39" x2="134" y2="39" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-tc)"/>
  <text x="190" y="34" font-size="8.5" text-anchor="middle">利用者へ配信：有料</text>
  <rect x="10" y="80" width="240" height="150" rx="6" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.4"/>
  <text x="18" y="96" font-size="9.5" fill-opacity="0.8">リージョンA</text>
  <rect x="270" y="80" width="100" height="150" rx="6" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.4"/>
  <text x="278" y="96" font-size="9.5" fill-opacity="0.8">リージョンB</text>
  <rect x="20" y="104" width="105" height="116" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <text x="108" y="118" font-size="8.5" text-anchor="end" fill-opacity="0.75">AZ-a</text>
  <rect x="135" y="104" width="105" height="116" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <text x="232" y="118" font-size="8.5" text-anchor="end" fill-opacity="0.75">AZ-b</text>
  <rect x="30" y="124" width="50" height="24" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="55" y="140" font-size="9.5" text-anchor="middle">EC2</text>
  <rect x="30" y="184" width="50" height="24" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="55" y="200" font-size="9.5" text-anchor="middle">EC2</text>
  <rect x="160" y="124" width="50" height="24" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="185" y="140" font-size="9.5" text-anchor="middle">EC2</text>
  <rect x="295" y="124" width="50" height="24" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="320" y="140" font-size="9.5" text-anchor="middle">EC2</text>
  <line x1="42" y1="58" x2="42" y2="120" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-tc-g)"/>
  <line x1="68" y1="124" x2="68" y2="62" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-tc)"/>
  <text x="76" y="68" font-size="8.5">↑ 送信：有料</text>
  <text x="76" y="80" font-size="8.5">↓ 受信：無料</text>
  <line x1="55" y1="148" x2="55" y2="180" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-tc-g)" marker-start="url(#arw-tc-g)"/>
  <text x="62" y="168" font-size="8.5">同じAZ：無料</text>
  <line x1="80" y1="136" x2="156" y2="136" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-tc)" marker-start="url(#arw-tc)"/>
  <text x="140" y="162" font-size="8.5">← AZ間：有料</text>
  <text x="152" y="174" font-size="8" fill-opacity="0.75">（両方向）</text>
  <line x1="210" y1="136" x2="291" y2="136" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-tc)"/>
  <text x="320" y="164" font-size="8.5" text-anchor="middle">リージョン間</text>
  <text x="320" y="176" font-size="8.5" text-anchor="middle">有料</text>
  <line x1="236" y1="80" x2="288" y2="57" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw-tc-g)"/>
  <text x="272" y="72" font-size="8.5">オリジンから：無料</text>
  <line x1="10" y1="246" x2="370" y2="246" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="10" y="264" font-size="10">VPCからS3へ（同じリージョン）</text>
  <rect x="10" y="280" width="50" height="24" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="35" y="296" font-size="9.5" text-anchor="middle">EC2</text>
  <rect x="96" y="272" width="124" height="24" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="158" y="288" font-size="9.5" text-anchor="middle">NAT Gateway</text>
  <rect x="96" y="310" width="124" height="24" rx="4" fill="#3F78D8" fill-opacity="0.14" stroke="#3F78D8" stroke-width="1.5"/>
  <text x="158" y="326" font-size="9.5" text-anchor="middle">ゲートウェイ型EP</text>
  <rect x="310" y="290" width="60" height="30" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="340" y="309" font-size="10" text-anchor="middle">S3</text>
  <line x1="60" y1="288" x2="92" y2="284" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-tc-g)"/>
  <line x1="60" y1="296" x2="92" y2="320" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-tc)"/>
  <line x1="220" y1="284" x2="306" y2="300" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arw-tc-g)"/>
  <line x1="220" y1="322" x2="306" y2="310" stroke="#3F78D8" stroke-width="1.5" marker-end="url(#arw-tc)"/>
  <text x="262" y="280" font-size="8.5" text-anchor="middle">時間＋処理料金</text>
  <text x="262" y="334" font-size="9" text-anchor="middle" font-weight="700">無料</text>
  <text x="10" y="354" font-size="9" fill-opacity="0.8">有料の経路を通さない設計が、そのままコスト削減になる</text>
</svg>
